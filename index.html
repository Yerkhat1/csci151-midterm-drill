 ex:[
  {q:"Modify your Lesson 3 code so input comes from the user via scanf instead of hard-coded values.",
   sol:`#include <stdio.h>
#include <math.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    double h, r;
    double PI = 3.14159265358979;

    printf("Enter cone height: ");
    scanf("%lf", &h);          /* %lf - it is a double */

    printf("Enter base radius: ");
    scanf("%lf", &r);

    double base    = PI * r * r;
    double slant   = sqrt(r*r + h*h);
    double surface = base + PI * r * slant;
    double volume  = base * h / 3.0;

    printf("Base area:    %.4f\\n", base);
    printf("Surface area: %.4f\\n", surface);
    printf("Volume:       %.4f\\n", volume);

    return 0;
}`,
   note:"Two things kill this exercise in an exam: <code>%f</code> instead of <code>%lf</code>, and a forgotten <code>&amp;</code>."},
  {q:"Write printf statements using format characters to convert: octal 010, 062, 05712 to decimal; decimal 5, 40, 125, 1000000 to octal; hex 0x23, 0x2A9, 0xDECAF to decimal; decimal 38, 259, 98765, 1000000 to hexadecimal.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    /* octal literal in, decimal out */
    printf("010   = %i\\n", 010);      /*      8 */
    printf("062   = %i\\n", 062);      /*     50 */
    printf("05712 = %i\\n", 05712);    /*   3018 */

    /* decimal in, octal out */
    printf("5       = %o\\n", 5);         /*        5 */
    printf("40      = %o\\n", 40);        /*       50 */
    printf("125     = %o\\n", 125);       /*      175 */
    printf("1000000 = %o\\n", 1000000);   /*  3641100 */

    /* hex literal in, decimal out */
    printf("0x23    = %i\\n", 0x23);      /*      35 */
    printf("0x2A9   = %i\\n", 0x2A9);     /*     681 */
    printf("0xDECAF = %i\\n", 0xDECAF);   /*  912559 */

    /* decimal in, hex out */
    printf("38      = %x\\n", 38);        /*      26 */
    printf("259     = %x\\n", 259);       /*     103 */
    printf("98765   = %x\\n", 98765);     /*   181cd */
    printf("1000000 = %x\\n", 1000000);   /*   f4240 */

    return 0;
}`,
   note:"The conversion happens entirely in the <i>format character</i> — the number in memory never changes, only how printf renders it. Note <code>010</code> in source means eight, not ten: a leading zero is an octal literal. Use <code>%X</code> for uppercase hex digits."},
  {q:"Find the largest int value that can be stored, by running printf(\"%i\", ...) with larger and larger numbers until you get garbage output.",
   sol:`#include <stdio.h>
#include <limits.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    printf("%i\\n", 2147483647);   /* INT_MAX - fine      */
    printf("%i\\n", 2147483648);   /* overflows - garbage */

    printf("INT_MAX = %i\\n", INT_MAX);
    printf("INT_MIN = %i\\n", INT_MIN);
    return 0;
}`,
   note:"On a typical 32-bit int: max <b>2147483647</b> = 2³¹−1, min <b>−2147483648</b>. One past the max wraps around to the minimum — that's integer overflow, and it is silent."}
 ]},

{n:5, mod:"Module 1", title:"Operators", gist:"Arithmetic, integer division, casting, modulo, enhanced assignment, relational and boolean operators.",
 points:[
  "Basic binary numeric operators <code>+ - * /</code>. Multiplication and division happen before addition and subtraction; equal precedence evaluates left to right; parentheses force an order.",
  "<b>If both operands are integers, the result is an integer</b> — division truncates. If either operand is floating-point, the result is floating-point.",
  "<b>Unary minus</b> takes precedence over the other arithmetic operations.",
  "<b>Type casting</b> forces a value to be treated as another type. Casting double→int <b>truncates at the decimal point</b> (it does not round). Casting int→double just adds 0s after the decimal point. Casting takes precedence over arithmetic.",
  "<b>Modulo %</b> gives the integer remainder of an integer division, with the <i>same precedence as * and /</i>. If the number is smaller than the modulus, the result is the number itself: <code>99 % 100</code> is 99.",
  "<b>Enhanced assignment</b>: <code>+= -= *= /= %=</code>, plus the unary <code>++</code> and <code>--</code>.",
  "<b>Relational</b>: <code>== != &lt; &gt; &lt;= &gt;=</code>. <b>Boolean</b>: <code>&amp;&amp;</code> AND, <code>||</code> OR, <code>!</code> NOT."
 ],
 traps:[
  {t:"Integer division", b:"<code>7 / 2</code> is <b>3</b>. <code>1 / 2</code> is <b>0</b>. <code>double x = 1/2;</code> stores <b>0.0</b> — the division finished as ints before the assignment ever happened. Fix: <code>1.0/2</code> or <code>(double)1/2</code>."},
  {t:"Casting truncates, never rounds", b:"<code>(int)3.99</code> is <b>3</b>. <code>(int)-3.99</code> is <b>-3</b>. Toward zero, always."},
  {t:"= versus ==", b:"<code>if (x = 5)</code> assigns 5 to x and is always true. <code>==</code> compares. This compiles without complaint."},
  {t:"Cast binds tighter than arithmetic", b:"<code>(double)a / b</code> casts a first, then does real division — correct. <code>(double)(a / b)</code> does the int division first, then casts the already-wrong answer."},
  {t:"Modulo precedence", b:"<code>%</code> sits with <code>*</code> and <code>/</code>, not below them. <code>2 + 7 % 3</code> is <code>2 + 1</code> = <b>3</b>."}
 ],
 quiz:[],
 ex:[
  {q:"Quadratic equation. Read three doubles a, b, c from the user and calculate both roots. Use sqrt from math.h. Don't worry about imaginary roots.",
   sol:`#include <stdio.h>
#include <math.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    double a, b, c;

    printf("Enter a, b, c: ");
    scanf("%lf %lf %lf", &a, &b, &c);

    double disc = b*b - 4*a*c;
    double root1 = (-b + sqrt(disc)) / (2*a);
    double root2 = (-b - sqrt(disc)) / (2*a);

    printf("Discriminant: %.4f\\n", disc);
    printf("Root 1: %.6f\\n", root1);
    printf("Root 2: %.6f\\n", root2);

    return 0;
}`,
   note:"The parentheses around <code>(2*a)</code> are mandatory. Without them you compute <code>(-b + sqrt(disc)) / 2 * a</code>, which multiplies by a instead of dividing. Classic mark-loser."},
  {q:"Sine approximation. Read a double x and approximate sin(x) with three terms of the Taylor series around 0. You may use pow(x, n).",
   sol:`#include <stdio.h>
#include <math.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    double x;
    printf("Enter x (radians): ");
    scanf("%lf", &x);

    /* sin x ~ x - x^3/3! + x^5/5! */
    double approx = x
                  - pow(x, 3) / 6.0        /* 3! = 6   */
                  + pow(x, 5) / 120.0;     /* 5! = 120 */

    printf("Approximation: %.8f\\n", approx);
    printf("Real sin(x):   %.8f\\n", sin(x));

    return 0;
}`,
   note:"Signs alternate − then +. Denominators are <b>factorials</b> 3!=6 and 5!=120, not the exponents. Write them as <code>6.0</code>/<code>120.0</code> so the division is floating-point."},
  {q:"Clock output. Read a single integer = seconds past midnight, and output the time in hh:mm:ss form.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int total;
    printf("Seconds past midnight: ");
    scanf("%i", &total);

    int hours   =  total / 3600;
    int minutes = (total % 3600) / 60;
    int seconds =  total % 60;

    printf("%02i:%02i:%02i\\n", hours, minutes, seconds);

    return 0;
}`,
   note:"This is <i>the</i> canonical integer-division-plus-modulo question and it shows up on exams constantly. <code>%02i</code> pads with a leading zero to width 2, so 3661 prints as 01:01:01 and not 1:1:1."}
 ]},

{n:6, mod:"Module 2", title:"For Loops", gist:"Loop syntax, control flow, infinite loops, nested loops, and for-loop variants.",
 points:[
  "Syntax: <code>for (initialiser; condition; updater) { body }</code>. The initialiser runs <b>once</b>; then the condition is checked <i>before</i> every iteration; the body runs; then the updater runs; repeat.",
  "<b>A for loop may never enter its body at all</b> — if the condition is false the first time, the body runs zero times.",
  "<b>Nested loops</b> are loops inside loops. The inner loop runs completely for each single iteration of the outer loop.",
  "Variants: multiple items in the initialiser and updater separated by commas; any of the three parts may be left <b>blank</b>. Blank condition = infinite loop.",
  "<code>for (i = 0; i &lt; n; i++)</code> runs <b>n</b> times, with i taking 0..n−1. <code>for (i = 1; i &lt;= n; i++)</code> also runs n times, with i taking 1..n."
 ],
 traps:[
  {t:"Semicolon after the for", b:"<code>for (i=0; i&lt;10; i++);</code> — that semicolon <i>is</i> the whole body. The block after it runs exactly once. No compiler warning."},
  {t:"Off by one", b:"<code>i &lt;= n</code> versus <code>i &lt; n</code> changes the iteration count by one. When counting to a target, write out the first and last values of i before you commit."},
  {t:"Modifying the counter inside the body", b:"Changing i inside the body as well as in the updater is the usual cause of an accidental infinite or half-length loop."},
  {t:"Nested loop counters", b:"An inner loop reusing the outer loop's variable destroys the outer loop. Use i for outer, j for inner."}
 ],
 quiz:[
  {q:"Write for loops that print 2,4,...,100 / 1,3,...,99 / 100,98,...,2 / 99,97,...,1.",
   a:`for (i = 2;   i <= 100; i += 2) printf("%i ", i);   /* 2,4,...,100  */
for (i = 1;   i <=  99; i += 2) printf("%i ", i);   /* 1,3,...,99   */
for (i = 100; i >=   2; i -= 2) printf("%i ", i);   /* 100,98,...,2 */
for (i = 99;  i >=   1; i -= 2) printf("%i ", i);   /* 99,97,...,1  */`}
 ],
 ex:[
  {q:"Print a Celsius-to-Fahrenheit conversion table for integer values from −50 C to 40 C. Use format strings like %10i for neat columns.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int c;

    printf("%10s%10s\\n", "Celsius", "Fahr");
    for (c = -50; c <= 40; c++) {
        double f = c * 9.0 / 5.0 + 32.0;
        printf("%10i%10.1f\\n", c, f);
    }

    return 0;
}`,
   note:"<code>9.0/5.0</code>, not <code>9/5</code> — the latter is 1 and every row would be wrong by a lot. <code>%10i</code> right-aligns in a field 10 wide."},
  {q:"Print 2, 4, 8, 16, 32, ..., 65536 — each number twice the previous. Hint: use the loop iterator to count the 16 iterations, and a separate variable for the value.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int i;
    int val = 1;

    for (i = 1; i <= 16; i++) {
        val = val * 2;
        printf("%i\\n", val);
    }

    return 0;
}`,
   note:"Start val at 1 and double <i>before</i> printing, so the first thing printed is 2 and the sixteenth is 65536 = 2¹⁶. Doubling after printing would give 1..32768."},
  {q:"Using the same idea, print a table displaying the powers of 2.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int i;
    int val = 1;

    printf("%5s%12s\\n", "n", "2^n");
    for (i = 0; i <= 16; i++) {
        printf("%5i%12i\\n", i, val);
        val = val * 2;
    }

    return 0;
}`,
   note:"Here the print comes <i>before</i> the doubling, because the table must start at 2⁰ = 1."},
  {q:"Use a nested for loop to print this design:<pre>+++++\n++++*\n+++**\n++***\n+****\n*****</pre>",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int row, col;

    for (row = 0; row <= 5; row++) {
        for (col = 0; col < 5 - row; col++)
            printf("+");
        for (col = 0; col < row; col++)
            printf("*");
        printf("\\n");
    }

    return 0;
}`,
   note:"Six rows, so <code>row</code> runs 0..5. Row r has (5−r) plus signs then r stars, and 5−r+r = 5 characters every time. Write the row/count table on your exam paper before coding — it turns the puzzle into arithmetic."},
  {q:"Get an integer n and a double x from the user, and use a loop to compute x to the power n. Do not use pow().",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n, i;
    double x, result = 1.0;

    printf("Enter x: ");  scanf("%lf", &x);
    printf("Enter n: ");  scanf("%i",  &n);

    for (i = 0; i < n; i++)
        result = result * x;

    printf("%.4f ^ %i = %.6f\\n", x, n, result);

    return 0;
}`,
   note:"result must start at <b>1.0</b>, not 0.0 — the identity for multiplication. Starting at 0 gives 0 forever. With n = 0 the loop runs zero times and correctly leaves 1.0."},
  {q:"Challenge. Get n and x, then compute x¹ + x² + x³ + ... + xⁿ without nested loops and without pow().",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n, i;
    double x, term = 1.0, sum = 0.0;

    printf("Enter x: ");  scanf("%lf", &x);
    printf("Enter n: ");  scanf("%i",  &n);

    for (i = 1; i <= n; i++) {
        term = term * x;   /* term is now x^i  */
        sum  = sum + term;
    }

    printf("Sum = %.6f\\n", sum);
    return 0;
}`,
   note:"The trick that kills the nested loop: carry <code>term</code> across iterations. Each pass multiplies by x once, so term walks x¹, x², x³... for free. Every \"no pow, no nested loops\" question uses this same move."},
  {q:"Challenge. Get n and x, then approximate eˣ with n+1 terms of its Taylor series. No pow(), no nested loops.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n, i;
    double x, term = 1.0, sum = 1.0;   /* i = 0 term is 1 */

    printf("Enter x: ");  scanf("%lf", &x);
    printf("Enter n: ");  scanf("%i",  &n);

    for (i = 1; i <= n; i++) {
        term = term * x / i;   /* x^i / i!  from the previous term */
        sum  = sum + term;
    }

    printf("e^%.4f ~ %.8f\\n", x, sum);
    return 0;
}`,
   note:"Same carried-term trick, now handling the factorial too: dividing by i each step turns (i−1)! into i!. One line does both x^i and i!."}
 ]},

{n:7, mod:"Module 2", title:"While Loops", gist:"While-loop control flow, infinite loops, numeric approximation, and the read-until-sentinel pattern.",
 points:[
  "Syntax: <code>while (condition) { body }</code>. The condition is checked <b>before</b> each iteration, so the body may run <b>zero</b> times.",
  "There's no built-in updater, so you must change something inside the body yourself or the loop never ends.",
  "<b>Anything a for loop can do, a while loop can do, and vice versa</b> — but one usually reads better than the other. Use <b>for</b> when you know the iteration count; <b>while</b> when you loop until a condition changes.",
  "The <b>sentinel input pattern</b>: prompt and read <i>before</i> the loop, then prompt and read again at the <i>end</i> of the body. The read appears twice on purpose."
 ],
 code:{label:"Sentinel pattern — from the lesson", src:`#include <stdio.h>
#include <math.h>

int main () {
  setvbuf(stdout, NULL, _IONBF, 0);

  double inval;

  printf("Enter in a value (enter a negative to quit): ");
  scanf("%lf", &inval);

  while (inval >= 0.0) {
    double outval = sqrt(inval);
    printf("Its square root is: %f\\n\\n", outval);

    printf("Enter in a value (enter a negative to quit): ");
    scanf("%lf", &inval);
  }

  printf("Done.");
  return 0;
}`},
 traps:[
  {t:"Forgetting to update", b:"<code>while (i &lt; 10) printf(\"%i\", i);</code> with no <code>i++</code> prints forever. The most common while-loop bug there is."},
  {t:"Reading only once", b:"In the sentinel pattern, if you read the input only before the loop, the condition never changes → infinite loop. If you read it only inside, the first check uses an uninitialised variable."},
  {t:"Semicolon again", b:"<code>while (cond);</code> — empty body, infinite loop if cond stays true."}
 ],
 quiz:[
  {q:"How are for and while loops similar, and how are they different?", a:"Similar: both are pre-test loops — the condition is evaluated before each iteration, so both can run their body zero times, and both can express exactly the same set of computations. Different: the for loop gathers initialiser, condition and updater into one header, which suits a known number of iterations; the while loop has only a condition, and the initialising and updating code lives outside and inside the body, which suits looping until some state changes."},
  {q:"Convert a for loop to a while loop and back.", a:`for (i = 0; i < n; i++) {
    body
}

/* the equivalent while */
i = 0;
while (i < n) {
    body
    i++;
}

/* and back: a while loop is a for with blank slots */
while (cond) { body }
for ( ; cond ; ) { body }`}
 ],
 ex:[
  {q:"Write a loop that prints the first 20 Fibonacci numbers. Hint: use separate variables for the previous two values.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int prev = 0, curr = 1;
    int count = 0;

    while (count < 20) {
        printf("%i ", curr);

        int next = prev + curr;
        prev = curr;
        curr = next;

        count++;
    }
    printf("\\n");
    return 0;
}`,
   note:"The order of the three reassignments matters. Save <code>next</code> first — if you overwrite <code>prev</code> before computing next, you lose the value you needed."},
  {q:"For a positive integer n, find the biggest integer k with n ≥ 2ᵏ (integer log base 2). Do not use pow, log2 or anything from math.h.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n;
    printf("Enter a positive integer: ");
    scanf("%i", &n);

    int k = 0;
    int power = 1;          /* 2^0 */

    while (power * 2 <= n) {
        power = power * 2;
        k++;
    }

    printf("Largest k with 2^k <= %i is k = %i (2^%i = %i)\\n",
           n, k, k, power);
    return 0;
}`,
   note:"Test the <i>next</i> power inside the condition, not the current one — otherwise you overshoot by one. Check by hand with n=8: should give k=3."}
 ]},

{n:8, mod:"Module 2", title:"Do-While Loops", gist:"The post-test loop, loop interchangeability, and break/continue.",
 points:[
  "Syntax: <code>do { body } while (condition);</code> — and yes, that <b>semicolon at the end is required</b>.",
  "The condition is checked <b>after</b> the body, so a do-while <b>always runs its body at least once</b>. That is the entire difference from a while loop.",
  "Use it when the action must happen before you can know whether to repeat — menus, input validation, successive division.",
  "For, while and do-while are <b>interchangeable</b>: any one can be rewritten as any other.",
  "<b>break</b> exits the loop immediately, from anywhere in the body. <b>continue</b> ends the current iteration but goes on to the next one (if the condition still holds). Don't overuse either — they make code harder to follow."
 ],
 code:{label:"Successive division — decimal to binary, from the lesson", src:`#include <stdio.h>

int main (void) {

  int decNum = 40;

  do {
    int bit = decNum % 2;
    decNum  = decNum / 2;

    printf("bit: %i \\n", bit);

  } while (decNum > 0);

  printf("Done.");
  return 0;
}`},
 traps:[
  {t:"Missing semicolon", b:"<code>} while (x &gt; 0)</code> without the trailing <code>;</code> is a syntax error. Everyone forgets it once."},
  {t:"\"At least once\" bites", b:"A do-while that validates input runs the body even when the data is already invalid. If the body must be skippable, you need a while — or an if wrapped around the do-while."},
  {t:"Bits come out backwards", b:"Successive division produces the <b>least</b> significant digit first. Printed in order, the binary number reads right-to-left."},
  {t:"continue in a while loop", b:"In a <b>for</b> loop, continue still runs the updater. In a <b>while</b> loop it jumps straight to the condition — so if your increment sits after the continue, you get an infinite loop."}
 ],
 quiz:[
  {q:"How are do-while loops different from for and while loops?", a:"for and while are pre-test loops: the condition is checked before the body, so the body can run zero times. do-while is a post-test loop: the body executes first and the condition is checked afterwards, so the body always runs at least once."},
  {q:"Convert a do-while into a while.", a:`do { body } while (cond);

/* equivalent while - run the body once, then loop */
body
while (cond) { body }

/* or, with a flag */
int first = 1;
while (first || cond) { first = 0; body }`},
  {q:"When is each loop preferable?", a:"for — a known number of iterations, e.g. walking an array of size n or printing a table from −50 to 40. while — repeat until a condition changes and it may not need to run at all, e.g. reading values until the user enters a negative. do-while — the body must happen at least once before you can decide, e.g. showing a menu, validating input, or successive division where even 0 produces one digit."}
 ],
 ex:[
  {q:"Ask the user for an integer, output its square, repeat until the input is less than or equal to 0.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n;

    do {
        printf("Enter an integer: ");
        scanf("%i", &n);

        if (n > 0)
            printf("%i squared is %i\\n", n, n * n);

    } while (n > 0);

    printf("Done.\\n");
    return 0;
}`,
   note:"The <code>if</code> inside stops it printing \"0 squared is 0\" on the quitting input. This is exactly the \"why might translating a while into a do-while need an if?\" question from Lesson 9."},
  {q:"Using a loop (not %o), take a positive integer n and display the polynomial for its octal representation. For n = 157: 157 = + (5 * 8^0) + (3 * 8^1) + (2 * 8^2). Then wrap it in a loop that asks for n and exits on a negative.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n;

    printf("Enter n (negative to quit): ");
    scanf("%i", &n);

    while (n >= 0) {
        int value = n;
        int power = 0;

        printf("%i = ", n);
        do {
            int digit = value % 8;
            value     = value / 8;

            printf("+ (%i * 8^%i) ", digit, power);
            power++;

        } while (value > 0);
        printf("\\n");

        printf("Enter n (negative to quit): ");
        scanf("%i", &n);
    }

    return 0;
}`,
   note:"Copy n into <code>value</code> before destroying it, so you can still print the original. A do-while is the right loop here: n = 0 must still print one term."},
  {q:"Modify the above to display the hexadecimal expansion instead (all displayed numbers still in decimal).",
   sol:`/* identical, with 8 replaced by 16 */
int value = n, power = 0;

printf("%i = ", n);
do {
    int digit = value % 16;
    value     = value / 16;

    printf("+ (%i * 16^%i) ", digit, power);
    power++;

} while (value > 0);
printf("\\n");`,
   note:"Only the base changes. Which tells you the next exercise is going to ask you to make it a variable."},
  {q:"Challenge. Also read an integer base b > 1 from the user, and display the base-b expansion of n.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n, b;

    printf("Enter n: ");            scanf("%i", &n);
    printf("Enter base b (>1): ");  scanf("%i", &b);

    int value = n;
    int power = 0;

    printf("%i = ", n);
    do {
        int digit = value % b;
        value     = value / b;

        printf("+ (%i * %i^%i) ", digit, b, power);
        power++;

    } while (value > 0);
    printf("\\n");

    return 0;
}`,
   note:"The general version. Note that <code>b</code> must be validated as > 1 — with b = 1 the division never shrinks value and you loop forever."}
 ]},

{n:9, mod:"Module 2", title:"If Statements", gist:"if, if-else, else-if chains, nested ifs, switch, and the ternary operator.",
 points:[
  "<code>if (expr) { ... }</code> runs the block when expr is true (nonzero). <code>else</code> gives the alternative. <code>else if</code> chains several mutually exclusive tests.",
  "An <b>else-if chain stops at the first true test</b> — later conditions are never evaluated. Order them from most specific to least.",
  "<b>Nested ifs</b>: an if inside another if's block. Indentation is for you; only braces decide structure.",
  "<b>switch</b> is like an else-if chain, but the item tested must be a variable of type <b>int</b> or <b>char</b>. Each case needs a <code>break</code> or execution falls through to the next case.",
  "<b>Ternary</b>: <code>cond ? valueIfTrue : valueIfFalse</code> — a compact if-else that produces a value."
 ],
 code:{label:"Nested ifs — the restaurant example from the lesson", src:`_Bool isHungry  = 1;  // true
_Bool isThirsty = 1;  // true
_Bool isSleepy  = 0;  // false

if ( isHungry ) {
    printf("Ordering manty \\n");
    if ( isThirsty ) {
       printf("Ordering pot of hot tea \\n");
    } else {
       printf("Ordering cup of water \\n");
    }
} else {
    if ( isSleepy ) {
       printf("Ordering black coffee \\n");
    }
    printf("Ordering baursaki \\n");
}`, out:"Ordering manty\nOrdering pot of hot tea", outnote:"isHungry is true so the else branch is skipped entirely — baursaki is never ordered no matter what isSleepy is. Then the inner if sees isThirsty true and picks tea."},
 traps:[
  {t:"= instead of ==", b:"<code>if (x = 0)</code> assigns and is false; <code>if (x = 5)</code> assigns and is always true. It compiles silently."},
  {t:"Dangling else", b:"An <code>else</code> binds to the <b>nearest unmatched if</b>, regardless of how you indented it. Always use braces on nested ifs."},
  {t:"Missing break in switch", b:"Without <code>break</code>, control falls through into the following cases and runs them too. Sometimes deliberate; usually a bug."},
  {t:"switch only takes int or char", b:"You cannot switch on a double or a string in C."},
  {t:"Ranges need two tests", b:"<code>if (0 &lt; x &lt; 10)</code> is legal C and always true: it computes <code>(0 &lt; x)</code> → 0 or 1, then compares that to 10. Write <code>if (x &gt; 0 &amp;&amp; x &lt; 10)</code>."}
 ],
 quiz:[
  {q:"When translating a while loop into a do-while, why might we need an if statement? Give an example.", a:"Because a do-while always executes its body once, while a while may execute it zero times. To preserve behaviour you guard the do-while with an if testing the same condition: <code>if (cond) { do { body } while (cond); }</code>. Example: a loop that squares user input until a non-positive number is entered — as a bare do-while it would print \"0 squared is 0\" for the very input that was meant to quit, so an if inside the body suppresses that."},
  {q:"Answer the nested-if question from the video.", a:"With isHungry = 1 and isThirsty = 1, the output is \"Ordering manty\" then \"Ordering pot of hot tea\". The whole else branch, including baursaki, is unreachable while isHungry is true — so isSleepy has no effect at all."},
  {q:"Where might a switch statement be useful?", a:"When one int or char variable selects among several fixed, discrete options: a menu choice ('a', 'b', 'c'), a day-of-week number, an operator character in a calculator, a state code. It reads far more cleanly than a long else-if chain of equality tests."},
  {q:"Where is the ternary operator useful?", a:"When you need a value rather than a branch, and the two alternatives are tiny: <code>max = (a > b) ? a : b;</code>, or inline in a printf, <code>printf(\"%i item%s\\n\", n, (n == 1) ? \"\" : \"s\");</code>. Anything longer belongs in a real if-else."}
 ],
 ex:[
  {q:"Read a final course grade percentage and output the letter grade.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    double pct;
    printf("Enter final percentage: ");
    scanf("%lf", &pct);

    if (pct < 0.0 || pct > 100.0) {
        printf("Invalid percentage.\\n");
        return 1;
    }

    if      (pct >= 90.0) printf("A\\n");
    else if (pct >= 80.0) printf("B\\n");
    else if (pct >= 70.0) printf("C\\n");
    else if (pct >= 60.0) printf("D\\n");
    else                  printf("F\\n");

    return 0;
}`,
   note:"Because the chain stops at the first true test, you only need the lower bound on each line — no <code>&amp;&amp; pct &lt; 90</code> anywhere. Order matters: go highest to lowest, or everything above 60 prints D."},
  {q:"Take an integer n and print all integers between 2 and n−1 that divide it evenly. For n = 100: 2, 4, 5, 10, 20, 25, 50.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n, i;
    printf("Enter n: ");
    scanf("%i", &n);

    for (i = 2; i <= n - 1; i++) {
        if (n % i == 0)
            printf("%i ", i);
    }
    printf("\\n");

    return 0;
}`,
   note:"<code>n % i == 0</code> is the divides-evenly test, and it's the workhorse of half the exam questions on this topic. The range excludes n itself, hence <code>i &lt;= n-1</code>."},
  {q:"Read an integer d between 1 and 366 (day of year, 2016). If outside the range, print an error and quit. Otherwise print the day of week, month name and day number — e.g. d = 100 gives \"It is Saturday, April 9\".",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int d;
    printf("Enter day of year (1-366): ");
    scanf("%i", &d);

    if (d < 1 || d > 366) {
        printf("Error: day out of range.\\n");
        return 1;
    }

    /* 2016 is a leap year; 1 Jan 2016 was a Friday */
    int dayLen[12] = {31,29,31,30,31,30,31,31,30,31,30,31};

    int month = 0;
    int rest  = d;
    while (rest > dayLen[month]) {
        rest  = rest - dayLen[month];
        month++;
    }
    /* rest is now the day within the month, month is 0-based */

    int weekday = (d + 4) % 7;   /* 0 = Sunday ... 4 = Thursday */

    printf("It is ");
    switch (weekday) {
        case 0: printf("Sunday");    break;
        case 1: printf("Monday");    break;
        case 2: printf("Tuesday");   break;
        case 3: printf("Wednesday"); break;
        case 4: printf("Thursday");  break;
        case 5: printf("Friday");    break;
        case 6: printf("Saturday");  break;
    }

    switch (month) {
        case  0: printf(", January");   break;
        case  1: printf(", February");  break;
        case  2: printf(", March");     break;
        case  3: printf(", April");     break;
        case  4: printf(", May");       break;
        case  5: printf(", June");      break;
        case  6: printf(", July");      break;
        case  7: printf(", August");    break;
        case  8: printf(", September"); break;
        case  9: printf(", October");   break;
        case 10: printf(", November");  break;
        case 11: printf(", December");  break;
    }

    printf(" %i\\n", rest);
    return 0;
}`,
   note:"Three techniques in one: range validation with an early <code>return 1</code>, subtracting month lengths in a while loop to convert day-of-year to month+day, and switch for the names. Check the weekday offset against a known date before trusting it."}
 ]},

{n:10, mod:"Module 2", title:"Formatted I/O", gist:"getchar and putchar, printf/scanf in detail, field widths and precision, reading strings.",
 points:[
  "All input and output in C is done with <b>function calls</b>, and they need <code>#include &lt;stdio.h&gt;</code>.",
  "<b>putchar(c)</b> writes a single character; <b>getchar()</b> reads and returns a single character. Lighter and more precise than printf/scanf when you're working character by character.",
  "Format specifier anatomy: <code>%</code>, optional <b>flag</b> (<code>-</code> left-align), optional <b>width</b>, optional <b>.precision</b>, then the conversion character. <code>%-10.3f</code> = left-aligned, at least 10 wide, 3 decimal places.",
  "Width is a <b>minimum</b>, never a maximum — a value too big for the field just overflows it, it is not truncated.",
  "For <code>%f</code> the precision is the number of decimal places. The default is 6.",
  "<b>Strings</b> are stored in char arrays. <code>scanf(\"%s\", name)</code> takes <b>no &amp;</b> — an array name is already an address.",
  "<code>%s</code> in scanf reads <b>only up to whitespace</b>, which it treats as a separator. That's how it splits input into separate words."
 ],
 traps:[
  {t:"No & on a string", b:"<code>scanf(\"%s\", &amp;name)</code> is wrong for a char array. Every other basic type needs the &amp;; a string does not."},
  {t:"%s stops at whitespace", b:"Typing \"Almaty City\" into one <code>%s</code> stores only \"Almaty\". \"City\" stays in the buffer and lands in your next scanf."},
  {t:"getchar returns an int", b:"Declare it as <code>int c = getchar();</code>, not char — it must be able to return EOF, which is not a character value."},
  {t:"The leftover newline", b:"After <code>scanf(\"%i\", &amp;n)</code> the Enter key is still in the buffer, so a following <code>getchar()</code> or <code>%c</code> grabs that newline instead of real input."},
  {t:"Width doesn't truncate", b:"<code>printf(\"%3i\", 123456)</code> prints all six digits. It pads short values; it never cuts long ones."}
 ],
 quiz:[
  {q:"Why use getchar and putchar when we have scanf and printf?", a:"They are simpler and more predictable when you're processing input one character at a time — counting letters, converting case, measuring word lengths. printf/scanf carry a whole format-parsing machine you don't need, and scanf's whitespace handling actively gets in the way when the whitespace itself is the data you care about."},
  {q:"Why is it useful that %s in scanf reads only up to whitespace?", a:"It gives you free tokenisation: each call hands back exactly one word, so reading a sequence of words takes a loop and nothing else. If %s swallowed everything up to the newline, you would have to split the string yourself. It also means several values can be read from one line with one scanf."}
 ],
 ex:[
  {q:"Prompt the user for some text, then output the number of occurrences of the letter 'a'.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int c;
    int count = 0;

    printf("Enter some text, then press Enter:\\n");

    while ((c = getchar()) != '\\n' && c != EOF) {
        if (c == 'a')
            count++;
    }

    printf("The letter 'a' appears %i times.\\n", count);
    return 0;
}`,
   note:"<code>(c = getchar()) != '\\n'</code> assigns and tests in one expression — the parentheses are required, because <code>!=</code> binds tighter than <code>=</code>. Count <code>'A'</code> too if the question says \"the letter a\" rather than lowercase a."},
  {q:"Prompt for text and output it with all lowercase letters converted to uppercase; everything else unchanged. Hint: use ASCII values.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int c;

    printf("Enter some text:\\n");

    while ((c = getchar()) != '\\n' && c != EOF) {
        if (c >= 'a' && c <= 'z')
            putchar(c - 'a' + 'A');
        else
            putchar(c);
    }
    putchar('\\n');

    return 0;
}`,
   note:"<code>c - 'a' + 'A'</code> is the standard shift, and it works because the alphabet is contiguous in ASCII. <code>'a'</code> is 97, <code>'A'</code> is 65, so the gap is exactly 32 — but write it with the letters, not the number 32."},
  {q:"Prompt for some words, then output the length of each word. Words may be separated by more than one whitespace character. Then extend it to output the length of the longest word.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int c;
    int len = 0, longest = 0;

    printf("Enter some words:\\n");

    while ((c = getchar()) != '\\n' && c != EOF) {

        if (c == ' ' || c == '\\t') {
            if (len > 0) {                   /* a word just ended */
                printf("Word length: %i\\n", len);
                if (len > longest) longest = len;
                len = 0;
            }
        } else {
            len++;
        }
    }

    if (len > 0) {                           /* last word, no trailing space */
        printf("Word length: %i\\n", len);
        if (len > longest) longest = len;
    }

    printf("Longest word: %i\\n", longest);
    return 0;
}`,
   note:"Two things make this exercise hard and both are marked: the <code>if (len &gt; 0)</code> guard, which stops repeated spaces printing zero-length words, and the flush after the loop, which catches the final word when the line doesn't end in a space."}
 ]},

{n:11, mod:"Module 2", title:"File I/O", gist:"fopen, fclose, fprintf, fscanf, getc, putc, feof and EOF.",
 points:[
  "Every console function has a file twin: printf→<b>fprintf</b>, scanf→<b>fscanf</b>, putchar→<b>putc</b>, getchar→<b>getc</b>. The file version takes the FILE pointer as an extra argument.",
  "Declare with <code>FILE *file;</code> and open with <code>file = fopen(\"name.txt\", \"w\");</code>. Modes: <b>\"r\"</b> read, <b>\"w\"</b> write (creates, and <b>wipes</b> an existing file), <b>\"a\"</b> append.",
  "<b>Always check <code>if (file == NULL)</code></b> right after opening, print a message and <code>return 1;</code>. This is expected in every answer.",
  "<b>fclose(file)</b> when you're done. Without it, buffered output can be lost.",
  "<code>fprintf(file, ...)</code> puts the FILE pointer first, then the format string. <code>fscanf(file, ...)</code> likewise — and still needs <code>&amp;</code> on the variables.",
  "<b>feof(file)</b> returns true once you've read past the end. <b>EOF</b> is the constant returned by getc at end of file.",
  "Exam list: <code>getchar(), putchar(), scanf(), printf()</code> — <code>fopen(), fclose(), getc(), putc(), fscanf(), fprintf(), feof(), EOF</code> — output specifiers <code>%i %d %o %x %f %e %g %c %s</code> — input specifiers <code>%i %f %lf %c %s</code>."
 ],
 code:{label:"File I/O template — from the lesson", src:`#include <stdio.h>

int main() {

  FILE *file;
  file = fopen("datafile.txt", "w");

  if (file == NULL) {
    printf("Problem opening file.");
    return 1;
  }

  printf("File opened successfully.");

  fprintf(file, "Hello there!");

  fclose(file);

  return 0;
}`},
 traps:[
  {t:"\"w\" destroys the file", b:"Opening an existing file with <code>\"w\"</code> truncates it to nothing immediately. Use <code>\"a\"</code> to add to the end."},
  {t:"feof lags by one read", b:"feof only becomes true <i>after</i> a read has already failed, so a plain <code>while (!feof(f))</code> loop processes the last record twice. The lesson's fix is the <code>fscanf(...); if (feof(infile)) break;</code> check right after the read."},
  {t:"Argument order", b:"<code>fprintf(file, \"%i\", x)</code> — file first. Writing <code>fprintf(\"%i\", file, x)</code> is a classic slip under time pressure."},
  {t:"Forgetting & in fscanf", b:"Same rule as scanf: <code>&amp;</code> on every basic type, none on a char array."}
 ],
 quiz:[],
 ex:[
  {q:"Copy the contents of an input file to another file, character by character. Both filenames come from the user at the start.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    char inName[81], outName[81];
    FILE *in;
    FILE *out;
    int c;

    printf("Input file name:  ");   scanf("%s", inName);
    printf("Output file name: ");   scanf("%s", outName);

    in  = fopen(inName,  "r");
    out = fopen(outName, "w");

    if (in == NULL || out == NULL) {
        printf("Problem opening files.\\n");
        return 1;
    }

    while ((c = getc(in)) != EOF)
        putc(c, out);

    fclose(in);
    fclose(out);

    printf("Copy complete.\\n");
    return 0;
}`,
   note:"No <code>&amp;</code> on <code>inName</code> — it's already an array. Note the argument order flips between the two calls: <code>getc(in)</code> but <code>putc(c, out)</code>."},
  {q:"Substitute the words found in values.txt for the '$' characters found in story.txt, printing the result to the console.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    FILE *story  = fopen("story.txt",  "r");
    FILE *values = fopen("values.txt", "r");

    if (story == NULL || values == NULL) {
        printf("Problem opening files.\\n");
        return 1;
    }

    int c;
    char word[81];

    while ((c = getc(story)) != EOF) {
        if (c == '$') {
            if (fscanf(values, "%s", word) == 1)
                printf("%s", word);
            else
                printf("$");        /* ran out of words */
        } else {
            putchar(c);
        }
    }

    fclose(story);
    fclose(values);
    return 0;
}`,
   note:"Read the story character by character, but the substitutions word by word — <code>%s</code> in fscanf conveniently stops at whitespace, so each '$' pulls exactly one word."},
  {q:"Extend the story generator so the result is written to a file, with the output filename entered by the user at the start.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    char outName[81];
    printf("Output file name: ");
    scanf("%s", outName);

    FILE *story  = fopen("story.txt",  "r");
    FILE *values = fopen("values.txt", "r");
    FILE *out    = fopen(outName,      "w");

    if (story == NULL || values == NULL || out == NULL) {
        printf("Problem opening files.\\n");
        return 1;
    }

    int c;
    char word[81];

    while ((c = getc(story)) != EOF) {
        if (c == '$') {
            if (fscanf(values, "%s", word) == 1)
                fprintf(out, "%s", word);
            else
                putc('$', out);
        } else {
            putc(c, out);
        }
    }

    fclose(story);
    fclose(values);
    fclose(out);

    printf("Story written to %s\\n", outName);
    return 0;
}`,
   note:"Same program with <code>printf</code>→<code>fprintf(out,...)</code> and <code>putchar</code>→<code>putc(...,out)</code>. Three opens means three NULL checks and three closes."}
 ]},

{n:12, mod:"Module 3", title:"Intro to Arrays", gist:"Declaring, indexing and initialising arrays, and how they sit in memory.",
 points:[
  "<code>int scores[10];</code> declares ten ints in one contiguous block. Valid indices are <b>0 to 9</b>.",
  "Index from <b>0</b>. The last element of an array of size n is <code>a[n-1]</code>.",
  "<b>Array initialiser</b>: <code>int a[5] = {3, 1, 4, 1, 5};</code>. Give fewer values and the rest become 0; give none of the size — <code>int a[] = {1,2,3};</code> — and C counts them for you.",
  "The elements sit next to each other in memory, which is why indexing is instant: the address is start + index × element size.",
  "C does <b>not</b> check bounds. <code>a[10]</code> on a size-10 array reads or writes whatever memory happens to be next door — no error, just corruption."
 ],
 traps:[
  {t:"Off-by-one at the end", b:"<code>for (i = 0; i &lt;= n; i++)</code> touches <code>a[n]</code>, one past the end. Use <code>i &lt; n</code>."},
  {t:"No bounds checking", b:"Reading <code>a[-1]</code> or <code>a[100]</code> compiles and runs. It may even look fine. This is the single biggest source of C bugs."},
  {t:"Arrays don't assign or compare", b:"<code>a = b;</code> and <code>if (a == b)</code> do not copy or compare contents. You need a loop."},
  {t:"Initialiser only at declaration", b:"<code>int a[3]; a = {1,2,3};</code> is a syntax error. The brace form works only on the declaration line."}
 ],
 quiz:[
  {q:"Think of practical examples where an array is useful.", a:"Exam scores for a class, daily temperatures for a month, pixel values in an image row, a histogram's bucket counts, the digits of a big number, a deck of cards, the months' lengths for a date calculation. Any time you'd otherwise name variables score1, score2, score3... you want an array."},
  {q:"You have a sorted array of doubles and want to insert a new value keeping it sorted, without losing old values. How? What problems appear?", a:"Walk from the start until you find the first element larger than the new value — that's the insertion position. Then shift every element from the end down to that position one slot to the right (iterate backwards so you don't overwrite as you go), and drop the new value in. The problems: the array has a fixed size, so there must be a spare slot at the end or the insert is impossible; you must track how many slots are actually in use separately from the declared size; and each insert costs up to n shifts, so building a sorted array this way is slow for large n."}
 ],
 ex:[
  {q:"Store the first ten factorial numbers (1, 1, 2, 6, 24, 120, 720, ...) in an integer array.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int fact[10];
    int i;

    fact[0] = 1;                       /* 0! = 1 by definition */
    for (i = 1; i < 10; i++)
        fact[i] = fact[i-1] * i;       /* i! = (i-1)! * i      */

    for (i = 0; i < 10; i++)
        printf("%i! = %i\\n", i, fact[i]);

    return 0;
}`,
   note:"Building each element from the previous one avoids a nested loop entirely — the same carried-value trick as the Taylor series exercises. Beware: 13! already overflows a 32-bit int."},
  {q:"Declare an integer array of size 20 and fill it with random numbers between 50 and 100 using rand() from stdlib.h. Print all values in a second loop.",
   sol:`#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int a[20];
    int i;

    srand(time(NULL));                 /* different numbers each run */

    for (i = 0; i < 20; i++)
        a[i] = 50 + rand() % 51;       /* 0..50, shifted to 50..100 */

    for (i = 0; i < 20; i++)
        printf("%i ", a[i]);
    printf("\\n");

    return 0;
}`,
   note:"For an inclusive range lo..hi the formula is <code>lo + rand() % (hi - lo + 1)</code>. Here that's <code>50 + rand() % 51</code> — using 50 instead of 51 silently loses the value 100."},
  {q:"Extend the previous program to find the minimum, maximum and average of the array values and print those too.",
   sol:`#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int a[20];
    int i;

    srand(time(NULL));
    for (i = 0; i < 20; i++)
        a[i] = 50 + rand() % 51;

    int min = a[0];
    int max = a[0];
    int sum = 0;

    for (i = 0; i < 20; i++) {
        if (a[i] < min) min = a[i];
        if (a[i] > max) max = a[i];
        sum = sum + a[i];
        printf("%i ", a[i]);
    }
    printf("\\n");

    double avg = (double)sum / 20;

    printf("Min: %i\\n", min);
    printf("Max: %i\\n", max);
    printf("Avg: %.2f\\n", avg);

    return 0;
}`,
   note:"Seed min and max with <code>a[0]</code>, never with 0 — a min initialised to 0 can never be beaten by values of 50 and up. And the average needs <code>(double)sum / 20</code>: plain <code>sum / 20</code> is integer division and throws away the decimals."}
 ]},

{n:13, mod:"Module 3", title:"More Arrays", gist:"Strings as char arrays, variable array sizes, and multi-dimensional arrays.",
 points:[
  "A <b>string</b> in C is an array of chars terminated by the <b>null character</b> <code>'\\0'</code>. <code>char name[81]</code> holds up to 80 real characters plus the terminator.",
  "An array's size can be given by a <b>variable</b> at declaration: <code>int R = 3; int a[R];</code>. This is not the same as resizing later — <b>an array's size cannot change after it is created</b>.",
  "<b>Multi-dimensional arrays</b> are arrays of arrays: <code>int a[R][C];</code> is R rows by C columns, accessed as <code>a[row][col]</code>.",
  "To walk a 2-D array you need nested loops: outer over rows i, inner over columns j.",
  "Printing a matrix: print the whole inner row with <code>printf(\"%5d\", a[i][j])</code>, then a single <code>printf(\"\\n\")</code> <b>after</b> the inner loop closes."
 ],
 code:{label:"Generic R x C matrix — from the lesson", src:`int R = 3, C = 4;
int a[R][C];

int i, j, val = 100;

/* set matrix elements */
for (i = 0; i < R; i++) {
  for (j = 0; j < C; j++) {
    a[i][j] = val;
    val++;
  }
}

/* print matrix elements */
for (i = 0; i < R; i++) {
  for (j = 0; j < C; j++) {
    printf("%5d", a[i][j]);
  }
  printf("\\n");
}`},
 traps:[
  {t:"Newline in the wrong place", b:"Put <code>printf(\"\\n\")</code> inside the inner loop and you get one number per line. It belongs between the two closing braces."},
  {t:"a[i,j] is not a thing", b:"C wants <code>a[i][j]</code>. <code>a[i,j]</code> compiles as the comma operator and does something else entirely."},
  {t:"Room for the null terminator", b:"A string of n characters needs an array of at least n+1. Forgetting <code>'\\0'</code> means printf runs off the end reading garbage."},
  {t:"Transpose dimensions flip", b:"Transposing an R×C matrix gives a <b>C×R</b> matrix. Declaring the result as R×C is wrong unless the matrix is square."},
  {t:"Rows and columns, not x and y", b:"<code>a[i][j]</code> is row i, column j. Mixing the order up is the most common 2-D array mistake in exams."}
 ],
 quiz:[
  {q:"Why can't an array be resized after creation?", a:"Its elements occupy one contiguous block of memory, and the compiler fixed that block's location and length when the array was created. The memory immediately after it has very likely been given to something else, so there is simply nowhere to grow into. Making the array bigger would mean finding a new, larger block elsewhere and copying everything across — which the language will not do behind your back."},
  {q:"How would you handle needing a bigger array than you declared?", a:"Declare a new, larger array and copy the old contents across with a loop, then work with the new one. The usual strategy is to double the size each time so the copying doesn't dominate. (The proper tool is dynamic allocation with malloc and realloc — Lesson 25 — but the copy-into-a-bigger-array idea is the same.)"},
  {q:"Where else are multi-dimensional arrays useful, other than matrices?", a:"Game boards — chess, minesweeper, tic-tac-toe. Images, where a[row][col] is a pixel. Spreadsheet-style tables. Distance tables between cities. A calendar as weeks × days. Seat maps. Anything naturally laid out as a grid."}
 ],
 ex:[
  {q:"Using nested loops, create a 12 x 12 multiplication table where element i,j holds i*j. Use a second pair of nested loops to print it.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int table[12][12];
    int i, j;

    for (i = 0; i < 12; i++)
        for (j = 0; j < 12; j++)
            table[i][j] = (i + 1) * (j + 1);

    for (i = 0; i < 12; i++) {
        for (j = 0; j < 12; j++)
            printf("%5i", table[i][j]);
        printf("\\n");
    }

    return 0;
}`,
   note:"Indices run 0..11 but the table should show 1×1 through 12×12, hence <code>(i+1)*(j+1)</code>. <code>%5i</code> keeps the columns aligned up to 144."},
  {q:"Starting from the R x C matrix code, transpose matrix a into a new matrix b of dimensions C x R, add 25 to each element, and print b.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int R = 3, C = 4;
    int a[R][C];
    int b[C][R];              /* note: C rows, R columns */
    int i, j, val = 100;

    for (i = 0; i < R; i++)
        for (j = 0; j < C; j++)
            a[i][j] = val++;

    /* transpose and add 25 */
    for (i = 0; i < R; i++)
        for (j = 0; j < C; j++)
            b[j][i] = a[i][j] + 25;

    for (i = 0; i < C; i++) {
        for (j = 0; j < R; j++)
            printf("%5d", b[i][j]);
        printf("\\n");
    }

    return 0;
}`,
   note:"The whole exercise is the single line <code>b[j][i] = a[i][j] + 25;</code> — indices swapped on the left. Then the printing loops must use C rows and R columns, not the other way round."},
  {q:"Find the maximum element in a two-dimensional matrix and print the row and column where it is.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int R = 3, C = 4;
    int a[3][4] = {
        { 5, 17,  3,  9},
        {42,  8, 23, 11},
        { 1, 39, 20,  7}
    };

    int i, j;
    int max = a[0][0];
    int maxRow = 0, maxCol = 0;

    for (i = 0; i < R; i++) {
        for (j = 0; j < C; j++) {
            if (a[i][j] > max) {
                max    = a[i][j];
                maxRow = i;
                maxCol = j;
            }
        }
    }

    printf("Maximum %i found at row %i, column %i\\n", max, maxRow, maxCol);
    return 0;
}`,
   note:"Update all three variables together inside the same if block. Updating max but forgetting maxRow/maxCol is the usual half-mark answer."},
  {q:"Create and initialise two 3 x 3 matrices, multiply them, and print the resulting 3 x 3 matrix.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int a[3][3] = {{1,2,3},{4,5,6},{7,8,9}};
    int b[3][3] = {{9,8,7},{6,5,4},{3,2,1}};
    int c[3][3];

    int i, j, k;

    for (i = 0; i < 3; i++) {
        for (j = 0; j < 3; j++) {
            c[i][j] = 0;                       /* must reset */
            for (k = 0; k < 3; k++)
                c[i][j] += a[i][k] * b[k][j];
        }
    }

    for (i = 0; i < 3; i++) {
        for (j = 0; j < 3; j++)
            printf("%6i", c[i][j]);
        printf("\\n");
    }

    return 0;
}`,
   note:"Three nested loops, and the index pattern is the thing to memorise: <code>a[i][k] * b[k][j]</code> — k is the one that runs, and it appears second on a and first on b. Setting <code>c[i][j] = 0</code> before the k loop is essential."}
 ]}

const BANK = [
{L:3, type:"mcq", q:"A program compiles, runs to completion, and reports that the average of 4 and 6 is 5.5 — but the correct answer for this data set should be 5. What kind of error is this?",
 choices:["A syntax error","A runtime error","A logical error","A linker error"], correct:2,
 why:"It compiled (so not syntax) and it ran to the end without crashing (so not runtime). The program is simply doing the wrong thing. Logical errors are the ones no tool catches for you."},

{L:5, type:"out", q:"What does this print?", code:`int a = 7, b = 2;
double r = a / b;
printf("%.2f", r);`, ans:"3.00",
 why:"Both a and b are ints, so a/b is integer division = 3, and the truncation is already done before the value is assigned to a double. Making it 3.5 needs (double)a / b."},

{L:5, type:"out", q:"What does this print?", code:`printf("%i", 2 + 7 % 3);`, ans:"3",
 why:"% has the same precedence as * and /, so it binds tighter than +. 7 % 3 is 1, then 2 + 1 = 3."},

{L:5, type:"out", q:"What does this print?", code:`printf("%i %i", (int)3.99, (int)-3.99);`, ans:"3 -3",
 why:"Casting a double to an int truncates at the decimal point — toward zero — it never rounds. So 3.99 becomes 3 and -3.99 becomes -3, not -4."},

{L:5, type:"mcq", q:"Which expression correctly computes the real-valued average of two ints x and y?",
 choices:["(double)(x + y) / 2","(double)((x + y) / 2)","(x + y) / 2","(x + y) / (double)2 / 2"], correct:0,
 why:"Option A casts the sum to double first, so the division is floating-point. Option B does the int division first and then casts an already-truncated result. Option C is pure int division."},

{L:5, type:"out", q:"What does this print?", code:`int x = 5;
x += 3;
x *= 2;
x %= 5;
printf("%i", x);`, ans:"1",
 why:"Step by step: x = 5, then 5+3 = 8, then 8*2 = 16, then 16 % 5 = 1."},

{L:4, type:"mcq", q:"You have double temp; and want to read a value into it from the user. Which line is correct?",
 choices:["scanf(\"%f\", &temp);","scanf(\"%lf\", &temp);","scanf(\"%lf\", temp);","scanf(\"%d\", &temp);"], correct:1,
 why:"A double needs %lf on INPUT, and scanf needs the address, so the & is required. %f on input is for float only — using it on a double silently corrupts the value."},

{L:4, type:"out", q:"What does this print?", code:`_Bool flag = 42;
printf("%i", flag);`, ans:"1",
 why:"A _Bool stores only 0 or 1. Assigning any nonzero value stores 1. There is no format specifier that prints \"true\"."},

{L:4, type:"out", q:"What does this print?", code:`printf("%i %i", 010, 0x10);`, ans:"8 16",
 why:"A leading 0 in the source makes an octal literal, so 010 is 8. A leading 0x makes it hex, so 0x10 is 16. Neither is ten."},

{L:6, type:"out", q:"How many lines does this print?", code:`int i;
for (i = 0; i < 10; i++);
{
    printf("hello\\n");
}`, ans:"1",
 why:"The semicolon right after the for header is the entire loop body. The loop spins ten times doing nothing, then the block runs once. No warning, no error."},

{L:6, type:"out", q:"What does this print?", code:`int i;
for (i = 10; i < 5; i++) {
    printf("x");
}
printf("done");`, ans:"done",
 why:"The condition is checked before the first iteration and it's already false, so the body runs zero times. A for loop may never enter its body."},

{L:6, type:"out", q:"What does this print?", code:`int i, j;
for (i = 1; i <= 3; i++) {
    for (j = 1; j <= 2; j++) {
        printf("%i%i ", i, j);
    }
}`, ans:"11 12 21 22 31 32",
 why:"The inner loop runs completely for every single iteration of the outer loop, so j cycles 1,2 three times while i advances once each cycle. 3 x 2 = 6 items."},

{L:6, type:"out", q:"What does this print?", code:`int i, val = 1;
for (i = 1; i <= 4; i++) {
    val = val * 2;
}
printf("%i", val);`, ans:"16",
 why:"val doubles four times: 2, 4, 8, 16. This is the powers-of-2 pattern from the Lesson 6 exercises."},

{L:7, type:"out", q:"What does this print?", code:`int n = 27, count = 0;
while (n > 0) {
    n = n / 2;
    count++;
}
printf("%i", count);`, ans:"5",
 why:"Integer division halves and truncates: 27→13→6→3→1→0. That's five iterations. This is the integer-log-base-2 idea, counted one higher."},

{L:7, type:"mcq", q:"In the sentinel input pattern from Lesson 7, why does the scanf appear twice?",
 choices:["Once for the prompt and once for the value","To read the value before the first condition check, and to refresh it before every later check","Because scanf fails the first time","To clear the newline from the buffer"], correct:1,
 why:"A while loop tests before the body runs, so the variable must already hold something on the first test. The second read at the bottom of the body supplies the next test's value. Drop either one and you get an uninitialised test or an infinite loop."},

{L:8, type:"out", q:"What does this print?", code:`int i = 10;
do {
    printf("%i ", i);
    i++;
} while (i < 5);`, ans:"10",
 why:"A do-while checks its condition AFTER the body, so the body always runs at least once — even though 10 < 5 was never true. This is the whole difference from a while loop."},

{L:8, type:"out", q:"What does this print? (one bit per line, shown here space-separated)", code:`int decNum = 13;
do {
    int bit = decNum % 2;
    decNum  = decNum / 2;
    printf("%i ", bit);
} while (decNum > 0);`, ans:"1 0 1 1",
 why:"Successive division gives the LEAST significant bit first: 13%2=1 (13→6), 6%2=0 (6→3), 3%2=1 (3→1), 1%2=1 (1→0). Read backwards, 1101 = 13."},

{L:8, type:"out", q:"What does this print?", code:`int i;
for (i = 1; i <= 5; i++) {
    if (i == 3) continue;
    if (i == 5) break;
    printf("%i ", i);
}`, ans:"1 2 4",
 why:"continue skips the print for i=3 but the loop goes on. break at i=5 leaves the loop entirely, so 5 is never printed."},

{L:9, type:"out", q:"What does this print?", code:`int x = 5;
if (x = 0) {
    printf("zero");
} else {
    printf("nonzero");
}
printf(" x=%i", x);`, ans:"nonzero x=0",
 why:"= is assignment, not comparison. x is set to 0, the if tests that 0, which is false, so the else runs — and x has been silently destroyed. Use ==."},

{L:9, type:"out", q:"What does this print?", code:`int score = 95;
if (score >= 60) printf("D");
else if (score >= 70) printf("C");
else if (score >= 80) printf("B");
else if (score >= 90) printf("A");`, ans:"D",
 why:"An else-if chain stops at the first true test. 95 >= 60 is true immediately, so the A, B and C branches are unreachable. Order the tests from highest to lowest."},

{L:9, type:"mcq", q:"What does if (0 < x && x < 10) become if you write it as if (0 < x < 10)?",
 choices:["The same thing","A syntax error","Always true","Always false"], correct:2,
 why:"(0 < x) evaluates first to 0 or 1, and both 0 and 1 are less than 10 — so the whole expression is always true, whatever x is. C accepts it without complaint. Ranges always need two comparisons joined with &&."},

{L:9, type:"out", q:"What does this print?", code:`int day = 3;
switch (day) {
    case 2: printf("Tue ");
    case 3: printf("Wed ");
    case 4: printf("Thu ");
        break;
    case 5: printf("Fri ");
}`, ans:"Wed Thu",
 why:"Control enters at case 3 and falls straight through case 4 because there's no break after Wed. It stops at the break following Thu. Missing breaks are the classic switch bug."},

{L:10, type:"out", q:"What does this print? (use _ to show each space)", code:`printf("[%5i]", 42);
printf("[%-5i]", 42);
printf("[%5i]", 1234567);`, ans:"[___42][42___][1234567]",
 why:"Width is a MINIMUM field size: 42 is padded to 5, the minus flag left-aligns it, and 1234567 simply overflows the field. Width never truncates."},

{L:10, type:"out", q:"What does this print?", code:`printf("%.2f %.0f %f", 3.14159, 2.7, 1.5);`, ans:"3.14 3 1.500000",
 why:"Precision after the dot is the number of decimal places for %f; %.0f shows none (and rounds); with no precision given the default is 6 decimal places."},

{L:10, type:"mcq", q:"The user types  Almaty City  in response to scanf(\"%s\", town);  What ends up in town?",
 choices:["\"Almaty City\"","\"Almaty\"","\"Almaty City\" without the space","Nothing — it fails"], correct:1,
 why:"%s reads only up to whitespace, which it treats as a separator. \"City\" stays in the input buffer and will be picked up by the next scanf — which is usually where the confusing bug shows up."},

{L:10, type:"out", q:"What does this print?", code:`char c = 'd';
putchar(c - 'a' + 'A');`, ans:"D",
 why:"'d' - 'a' is 3 (the letter's position in the alphabet), and 'A' + 3 is 'D'. Works because the alphabet is contiguous in ASCII."},

{L:11, type:"mcq", q:"Which line correctly writes the int x to an already-opened file f?",
 choices:["fprintf(\"%i\", f, x);","fprintf(f, \"%i\", x);","printf(f, \"%i\", x);","fscanf(f, \"%i\", x);"], correct:1,
 why:"The FILE pointer always comes first, then the format string, then the values. fprintf(f, \"%i\", x) is the only one with the right function and the right argument order."},

{L:11, type:"mcq", q:"You open an existing file that already contains data with fopen(\"log.txt\", \"w\"). What happens to the old contents?",
 choices:["New data is added at the end","The old contents are erased","fopen returns NULL","The old contents are kept and overwritten from the start"], correct:1,
 why:"Mode \"w\" truncates the file to zero length the moment it opens. To add to the end you need \"a\". This one destroys people's work in labs constantly."},

{L:11, type:"out", q:"A file holds exactly three records. Roughly what goes wrong with this loop?", code:`while (!feof(infile)) {
    fscanf(infile, "%s %i", name, &age);
    printf("%s %i\\n", name, age);
}`, ans:"the last record prints twice",

{L:12, type:"out", q:"What does this print?", code:`int a[5] = {3, 1, 4};
printf("%i %i %i", a[0], a[3], a[4]);`, ans:"3 0 0",

{L:12, type:"out", q:"What is the last valid index of  int scores[10];  ?", code:`int scores[10];`, ans:"9",

int i, sum = 0;
for (i = 0; i < 4; i++)
    sum += a[i];
printf("%i %.2f", sum, (double)sum / 4);`, ans:"20 5.00",

{L:13, type:"out", q:"What does this print?", code:`int a[2][3] = {{1,2,3},{4,5,6}};
printf("%i %i", a[1][0], a[0][2]);`, ans:"4 3",

{L:13, type:"out", q:"How many lines of output does this produce?", code:`int i, j;

        printf("\\n");

}`, ans:"12",

 {type:"out", L:5, q:"What is the console output of the following fragment?",
  code:`int i = 4000;
float f = 901.6;
float result = (float) i + (int) f;
printf("%f", result);`, ans:"4901",
  why:"(int)901.6 truncates to 901, plus 4000 = 4901 (the grader accepted 4901; %f would print 4901.000000). The casts apply before the addition."},
 {type:"out", L:5, q:"What is the console output of the following fragment?",
  code:`int i = 2866;
float f = i / 2;
printf("%f", f);`, ans:"1433",
  why:"i / 2 is int ÷ int = 1433 — integer division happens first, THEN the result is stored in a float. Declaring f as float does not rescue it."},
 {type:"out", L:5, q:"What is the console output of the following fragment?",
  code:`int a = 3109;
int b = a++;
printf("%i", a + b % 10);`, ans:"3119",
  why:"b = a++ gives b the OLD value 3109, then a becomes 3110. % binds tighter than +, so a + b % 10 = 3110 + (3109 % 10) = 3110 + 9 = 3119."},
 {type:"out", L:6, q:"What is the console output of the following fragment?",
  code:`for (int k = 37; k < 40; k++) {
    for (int j = k; j > 37; j--) {
        printf("%i", j);
    }
}`, ans:"383938",
  why:"k=37: inner never runs (37 is not > 37). k=38: prints 38. k=39: prints 39 then 38. No spaces between → 38 3938 → 383938."},
 {type:"out", L:13, q:"On the real exam this was drag-and-drop. Console input is 5. Type the 9 output numbers in reading order (each row left-to-right).",
  code:`int a[3][3], i, j, k;
scanf("%i", &k);            // k = 5

for (i = 1; i < 3; i++)
    for (j = 1; j < 3; j++)
        a[i][j] = 1;

for (i = 0; i < 3; i++)
    for (j = 0; j < 3; j++)
        if (i - j == 2 || j - i == 2)
            a[i][j] = k - 2;

for (i = 1; i >= 0; i--)
    for (j = 1; j >= 0; j--)
        a[i][j] = k * a[i + 1][j + 1];

a[0][0] = k - a[2][2];

for (i = 0; i < 3; i++) {
    for (j = 0; j < 3; j++)
        printf("%i ", a[i][j]);
    printf("\\n");
}`, ans:"4 5 3 5 5 1 3 1 1",
  why:"Final grid:\n4 5 3\n5 5 1\n3 1 1\nWork the four phases in order: fill the lower-right 2×2 with 1; set the anti-diagonal corners to k−2 = 3; overwrite the top-left 2×2 with k × (its down-right neighbour); finally a[0][0] = k − a[2][2]. This 2-D array trace is the hardest of the tracing questions."},
 {type:"write", L:8, q:"Match each do-while loop to its behaviour (real exam was drag-and-drop):\nA:  int i=0; do { printf(\"%i\",i); i--; } while (i>0);\nB:  int i=1; do { printf(\"%i\",i); continue; i--; } while (i>0);\nC:  int i=2; do { break; printf(\"%i\",i); i--; } while (i>0);\nD:  int i=3; do { printf(\"%i\",i); i--; continue; } while (i>0);\n\nChoices: entered exactly once with output · infinite loop · entered but no output · entered a finite number of times > 1.",
  sol:`A → entered exactly once, produces output
     prints 0, i becomes -1, condition false → done.

B → infinite loop
     continue jumps to the while test BEFORE i--, so i stays 1 forever.

C → entered but produces no output
     break fires before the printf ever runs.

D → entered a finite number of times greater than one
     prints 3, 2, 1; the continue sits at the end of the body, so it's harmless.`,
  why:"The whole question is the behaviour of continue in a do-while: it jumps straight to the condition. In B that skips the decrement (infinite); in D it changes nothing. break in C exits before printing."},
 {type:"out", L:10, q:"The user types  He is 89 years old!  then a newline. What does this print?",
  code:`char c;
int s = 0;

do {
    c = getchar();
    if (c >= 'a' && c <= 'z') {
        s++;
    } else if (c >= '0' && c <= '9') {
        s += c - '0';
    } else {
        s--;
    }
} while (c != '\\n');

printf("%i", s);`, ans:"21",
  why:"Per character: a lowercase letter adds 1; a digit adds its VALUE (c − '0'); anything else (uppercase, space, '!', newline) subtracts 1. The digits 8 and 9 add 17 on their own. The running total ends on 21. getchar + ASCII arithmetic, character by character."},
 {type:"write", L:1, q:"Select ALL true statements about high-level languages (real exam was multi-select):\n1) used only to write comments\n2) their programs are strings of binary numbers\n3) they are portable\n4) they are machine-dependent\n5) they provide abstractions to write code in a more concept-based way\n6) they use English-like abbreviations for elementary operations written in binary",
  sol:`TRUE: 3 (portable) and 5 (abstractions / concept-based).

Everything else is false:
1, 2, 4 are just wrong for high-level languages.
6 is the definition of ASSEMBLY language, not high-level — the classic distractor.`,
  why:"Option 6 ('English-like abbreviations for machine operations') describes assembly. High-level = portable + provides abstractions. Selecting 6 is the mistake that cost marks on the real paper."},
 {type:"out", L:7, q:"What is the console output of the following fragment?",
  code:`int n = 10;
int r = 0;

while (n > 5) {
    r += n;
    n -= 2;
}

printf("%i", r);`, ans:"24",
  why:"n=10 → r=10, n=8; n=8 → r=18, n=6; n=6 → r=24, n=4; 4 > 5 is false → stop. r = 24. Trace both variables together, one line at a time."},
 {type:"out", L:5, q:"What is the console output of the following fragment?",
  code:`int a = 1979;
int b = 2;
printf("%i", a / b);`, ans:"989",
  why:"1979 / 2 with two ints is integer division = 989; the fractional .5 is discarded."},
 {type:"write", L:7, q:"THE BIG ONE — 10 of 25 marks (40% of the whole exam). Write a C program that reads integers from input, one per line: if the number is negative, terminate with no further output; if it is positive, print the sum of all EVEN numbers from 1 to N inclusive. Input is never 0, and you keep reading until a negative number arrives.",
  code:`Example (input → output):
6   -> 12    (2 + 4 + 6)
5   -> 6     (2 + 4)
6   -> 12
-1  -> nothing, program ends`, sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n;
    while (1) {
        scanf("%i", &n);
        if (n < 0) {
            break;
        } else {
            int sum = 0;
            for (int i = 1; i <= n; i++) {
                if (i % 2 == 0)
                    sum += i;
            }
            printf("%i\\n", sum);
        }
    }
    return 0;
}`,
  why:"This single question is 40% of the grade — it decides your midterm more than everything else combined. It's a read-until-sentinel loop — while(1) with break on a negative — wrapping an inner sum-of-evens loop. On the real exam it ran against hidden test cases, so exact output matters: one sum per line, nothing extra. This is why the Write code tab is the most important thing to grind."}
]},
{id:"m1a", title:"Mock Midterm 1 — Paper A", mins:60, qs:[
 {type:"mcq", L:1, q:"Which of these is NOT part of a CPU as listed in Lesson 1?",
  choices:["Arithmetic Logic Unit","Program Counter","Secondary Storage","Control Unit"], correct:2,
  why:"Secondary storage (disks, SSDs) is separate hardware, not part of the CPU. The CPU contains the CU, ALU, FPU, registers and the program counter."},
 {type:"mcq", L:1, q:"Which statement is true?",
  choices:["Assembly language is portable across CPU families","A compiler translates assembly into machine code","High-level languages are generally portable because compilers exist for different CPUs","Machine code is a high-level language"], correct:2,
  why:"Assembly and machine code are low-level and CPU-specific, so not portable. An ASSEMBLER does assembly→machine code; a COMPILER does high-level→low-level."},
 {type:"mcq", L:3, q:"A program runs to the end but prints a wrong total. This is:",
  choices:["a syntax error","a runtime error","a logical error","a compile error"], correct:2,
  why:"It compiled and it ran — only the result is wrong. That is a logical error, and no tool catches it for you."},
 {type:"out", L:5, q:"What is printed?", code:`int a = 17, b = 5;
printf("%i %i %i", a/b, a%b, a/(double)b > 3.0);`, ans:"3 2 1",
  why:"17/5 is integer division = 3. 17%5 = 2. The third: 17/5.0 = 3.4, which is greater than 3.0, and a true relational expression has the value 1."},
 {type:"out", L:5, q:"What is printed?", code:`double x = 1 / 4;
printf("%.2f", x);`, ans:"0.00",
  why:"1 and 4 are both ints, so 1/4 evaluates to 0 before it's ever assigned to x. Declaring x as double does not retroactively fix the division. Write 1.0/4."},
 {type:"out", L:4, q:"What is printed?", code:`char c = 'B';
printf("%c %i", c, c);`, ans:"B 66",
  why:"Chars are stored as their ASCII values. %c renders it as a character, %i shows the underlying number. 'A' is 65, so 'B' is 66."},
 {type:"out", L:6, q:"What is printed?", code:`int i, total = 0;
for (i = 1; i <= 5; i++) {
    if (i % 2 == 0) continue;
    total += i;
}
printf("%i", total);`, ans:"9",
  why:"continue skips the even values, so only 1 + 3 + 5 are added = 9."},
 {type:"out", L:8, q:"What is printed?", code:`int n = 0;
do {
    printf("%i ", n);
    n--;
} while (n > 0);`, ans:"0",
  why:"The body always runs once before the condition is tested. It prints 0, decrements to -1, and then the condition fails. A while loop here would print nothing."},
 {type:"out", L:9, q:"What is printed?", code:`int a = 1, b = 0;
if (a && b)      printf("both");
else if (a || b) printf("one");
else             printf("neither");`, ans:"one",
  why:"a && b is 1 && 0 = false. a || b is 1 || 0 = true, so the else-if branch runs and the chain stops there."},
 {type:"out", L:10, q:"What is printed? (write _ for each space)", code:`printf("[%8.3f]", 3.14159);`, ans:"[___3.142]",
  why:"Precision 3 rounds to 3.142 (five characters), then width 8 right-pads it with three leading spaces. Width counts the whole rendered value including the decimal point."},
 {type:"write", L:5, q:"Write a complete C program that reads an integer number of seconds past midnight from the user and prints the time as hh:mm:ss with two digits in each field.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int total;
    printf("Seconds past midnight: ");
    scanf("%i", &total);

    int hours   =  total / 3600;
    int minutes = (total % 3600) / 60;
    int seconds =  total % 60;

    printf("%02i:%02i:%02i\\n", hours, minutes, seconds);
    return 0;
}`,
  why:"Marks: #include and main (1), scanf with %i and & (1), correct hours/minutes/seconds arithmetic (3), %02i formatting (1). The minutes line is where most people slip — you must take the remainder modulo 3600 BEFORE dividing by 60."},
 {type:"write", L:12, q:"Write code that declares an int array of size 10, fills it with the squares 1, 4, 9, ..., 100 using a loop, and then prints the largest value and its index.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int a[10];
    int i;

    for (i = 0; i < 10; i++)
        a[i] = (i + 1) * (i + 1);

    int max = a[0];
    int maxIdx = 0;

    for (i = 0; i < 10; i++) {
        if (a[i] > max) {
            max = a[i];
            maxIdx = i;
        }
    }

    printf("Largest: %i at index %i\\n", max, maxIdx);
    return 0;
}`,
  why:"Marks: declaration (1), fill loop with (i+1) squared (2), max initialised from a[0] not 0 (1), index updated inside the same if (1), output (1). Using i < 10 rather than i <= 10 is worth a mark on its own."}
]},

{id:"m1b", title:"Mock Midterm 1 — Paper B", mins:60, qs:[
 {type:"mcq", L:2, q:"The three stages of program creation and execution are:",
  choices:["Write, Run, Debug","Write, Build (compile and link), Run","Compile, Link, Debug","Design, Write, Compile"], correct:1,
  why:"Straight from Lesson 2. Note that build means compile AND link — linking is what combines multiple files and libraries into one executable."},
 {type:"mcq", L:4, q:"Which pair of format specifiers is correct for reading a double and printing it?",
  choices:["scanf %f, printf %lf","scanf %lf, printf %f","scanf %d, printf %f","scanf %lf, printf %lf"], correct:1,
  why:"Input needs %lf for a double; output takes %f for both floats and doubles. The asymmetry is deliberate and it is examined constantly."},
 {type:"out", L:5, q:"What is printed?", code:`int x = 10;
x = x++ + 2;
printf("%i", x);`, ans:"12",
  why:"x++ yields the current value 10 and then increments; the assignment writes 10 + 2 = 12 over the top of it. The increment is lost. (Expressions that modify a variable twice are genuinely murky in C — which is exactly why you should never write them.)"},
 {type:"out", L:5, q:"What is printed?", code:`printf("%i", 100 % 7 * 2);`, ans:"4",
  why:"% and * have equal precedence and evaluate left to right: (100 % 7) = 2, then 2 * 2 = 4. Not 100 % 14."},
 {type:"out", L:6, q:"What does this print?", code:`int i, j;
for (i = 3; i >= 1; i--) {
    for (j = 0; j < i; j++)
        printf("*");
    printf("\\n");
}`, ans:"***\n**\n*",
  why:"Row i prints i stars, with i counting down 3, 2, 1. The newline sits between the two closing braces, so one line per outer iteration."},
 {type:"out", L:7, q:"What is printed?", code:`int n = 1, count = 0;
while (n < 100) {
    n = n * 3;
    count++;
}
printf("%i %i", n, count);`, ans:"243 5",
  why:"n goes 3, 9, 27, 81, 243 — five iterations. The loop exits only after n passes 100, so the final value is 243, not 81."},
 {type:"out", L:9, q:"What is printed?", code:`int temp = 15;
if (temp > 30)      printf("hot");
else if (temp > 20) printf("warm");
else if (temp > 10) printf("mild");
else                printf("cold");`, ans:"mild",
  why:"The chain stops at the first true test. 15 is not > 30 or > 20, but it is > 10."},
 {type:"out", L:13, q:"What is printed?", code:`int m[3][3] = {{1,2,3},{4,5,6},{7,8,9}};
int i, sum = 0;
for (i = 0; i < 3; i++)
    sum += m[i][i];
printf("%i", sum);`, ans:"15",
  why:"Using the same variable for both indices walks the main diagonal: 1 + 5 + 9 = 15. A useful pattern to recognise on sight."},
 {type:"mcq", L:11, q:"Which sequence is the correct minimum for writing to a file?",
  choices:["fopen, fprintf, fclose","fopen, check NULL, fprintf, fclose","fprintf, fopen, fclose","fopen, fscanf, fclose"], correct:1,
  why:"The NULL check is not optional — it is expected in every file-I/O answer. Open, verify, write, close."},
 {type:"out", L:10, q:"The user types   42abc   at this scanf. What is printed?", code:`int n;
scanf("%i", &n);
printf("%i", n);`, ans:"42",
  why:"scanf with %i consumes digits until it hits something that cannot be part of an integer. It takes 42 and leaves \"abc\" sitting in the buffer, where it will wreck the next read."},
 {type:"write", L:9, q:"Write a complete program that reads an integer n from the user and prints every integer between 2 and n-1 that divides n evenly.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n, i;

    printf("Enter n: ");
    scanf("%i", &n);

    for (i = 2; i <= n - 1; i++) {
        if (n % i == 0)
            printf("%i ", i);
    }
    printf("\\n");

    return 0;
}`,
  why:"Marks: input with & (1), loop bounds starting at 2 and stopping at n-1 (2), the n % i == 0 test (2), output (1). Starting at 1 or including n itself loses marks."},
 {type:"write", L:13, q:"Write code that creates a 4 x 4 matrix where element [i][j] holds i+j, then prints it as a neat grid with each number in a field 4 wide.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int a[4][4];
    int i, j;

    for (i = 0; i < 4; i++)
        for (j = 0; j < 4; j++)
            a[i][j] = i + j;

    for (i = 0; i < 4; i++) {
        for (j = 0; j < 4; j++)
            printf("%4i", a[i][j]);
        printf("\\n");
    }

    return 0;
}`,
  why:"Marks: 2-D declaration (1), nested fill loops (2), nested print loops (2), the newline placed between the closing braces, not inside the inner loop (1). That last one is the single most commonly lost mark on array questions."}
]}
];

      </div>
