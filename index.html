function tickClock(){
  const b = document.getElementById('cd');
  if(!b) return;
  const diff = EXAM_DATE - new Date();
  if(diff <= 0){ b.textContent = "It's exam time — go."; return; }
  const d = Math.floor(diff/86400000);
  const h = Math.floor(diff/3600000)%24;
  const m = Math.floor(diff/60000)%60;
  const sec = Math.floor(diff/1000)%60;
  b.textContent = `${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`;
}
setInterval(tickClock, 1000);

  wrap.appendChild(chips);

function buildPracticeCard(item){
  const card = el('div','q');
  const typeLabel = item.type==='mcq' ? 'Multiple choice' : 'Predict output';
  card.appendChild(el('div','q-top', `<span class="pill acc">L${item.L}</span><span class="pill">${typeLabel}</span>`));
  card.appendChild(el('div','q-text', item.q));
  if(item.code) card.appendChild(el('div',null, pre(item.code)));

  const ans = el('div','ans'); ans.hidden = true;
  ans.appendChild(el('div','why', item.why));

  if(item.type==='mcq'){
    const box = el('div','choices');
    item.choices.forEach((ch,i)=>{
      const lab = el('label','choice');
      lab.innerHTML = `<input type="radio" name="p-${cardId(item)}"><span>${esc(ch)}</span>`;
      lab.addEventListener('click', ()=>{
        if(card.dataset.locked) return;
        card.dataset.locked='1';
        [...box.children].forEach((c,j)=>{
          if(j===item.correct) c.classList.add('right');
          else if(j===i) c.classList.add('wrong');
        });
        ans.hidden=false;
      });
      box.appendChild(lab);
    });
    card.appendChild(box);
    card.appendChild(ans);
  } else {
    const row = el('div','btn-row');
    const input = el('input'); input.type='text'; input.placeholder='your output…'; input.style.maxWidth='260px';
    const check = el('button','act','Check'); check.type='button';
    const verdict = el('span','verdict');
    check.addEventListener('click', ()=>{
      const ok = norm(input.value)===norm(item.ans);
      verdict.textContent = ok ? 'correct' : 'not quite';
      verdict.className = 'verdict ' + (ok?'ok':'bad');
      ans.hidden=false;
    });
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') check.click(); });
    row.appendChild(input); row.appendChild(check); row.appendChild(verdict);
    card.appendChild(row);
    ans.insertBefore(el('div',null,`<span class="eyebrow">Answer</span> <code>${esc(item.ans)}</code>`), ans.firstChild);
    card.appendChild(ans);
  }
  return card;
}
let _cid=0; const _cidMap=new WeakMap();
function cardId(item){ if(!_cidMap.has(item)) _cidMap.set(item, ++_cid); return _cidMap.get(item); }

      <p style="margin-top:6px">${ex.qs.length} questions · ${ex.mins} min · ${counts.out||0} trace, ${counts.write||0} write-code${counts.mcq?`, ${counts.mcq} choice`:''}</p>

function startExam(ex){
  if(examTimer){ clearInterval(examTimer); examTimer=null; }
  const s=document.getElementById('v-exam');
  s.innerHTML='';
  const wrap=el('div','col stack');

  // sticky top: timer + progress + submit
  const top=el('div','examtop');
  top.innerHTML=`<span class="timer" id="etimer">${fmtTime(ex.mins*60)}</span>
     <div class="bar-track"><div class="bar-fill" id="ebar"></div></div>`;
  const submit=el('button','act','Submit'); submit.type='button';
  const back=el('button','act ghost','Leave'); back.type='button';
  back.addEventListener('click', renderExam);
  top.appendChild(submit); top.appendChild(back);
  wrap.appendChild(top);
  wrap.appendChild(el('div',null,`<h2 style="font-size:19px">${esc(ex.title)}</h2>`));

  const scoreLine=el('div'); scoreLine.hidden=true; wrap.appendChild(scoreLine);

  const cards=ex.qs.map((q,i)=>{ const c=buildExamCard(q,i); wrap.appendChild(c.node); return c; });

  let finished=false;
  function finish(){
    if(finished) return; finished=true;
    if(examTimer){ clearInterval(examTimer); examTimer=null; }
    let auto=0, autoTotal=0, writeTotal=0;
    cards.forEach(c=>{
      const r=c.grade();
      if(r.kind==='auto'){ autoTotal++; if(r.correct) auto++; }
      else writeTotal++;
    });
    scoreLine.hidden=false;
    scoreLine.className='clock';
    scoreLine.innerHTML=`<b>${auto}/${autoTotal}</b><small>auto-graded correct${writeTotal?` · ${writeTotal} write-code question${writeTotal>1?'s':''} to self-mark below`:''}</small>`;
    submit.textContent='Submitted'; submit.disabled=true;
    scoreLine.scrollIntoView({behavior:'smooth', block:'center'});
  }
  submit.addEventListener('click', finish);

  // timer
  let remaining=ex.mins*60; const total=ex.mins*60;
  const tEl=top.querySelector('#etimer'); const bar=top.querySelector('#ebar');
  examTimer=setInterval(()=>{
    remaining--;
    tEl.textContent=fmtTime(Math.max(remaining,0));
    if(remaining<=60) tEl.classList.add('low');
    bar.style.width=(100*(total-remaining)/total)+'%';
    if(remaining<=0){ clearInterval(examTimer); examTimer=null; finish(); }
  },1000);

  s.appendChild(wrap);
  window.scrollTo({top:0});
}
function fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }

function buildExamCard(q, idx){
  const card=el('div','q');
  const label={mcq:'Multiple choice', out:'Predict output', write:'Write code'}[q.type];
  card.appendChild(el('div','q-top',`<span class="pill acc">Q${idx+1}</span><span class="pill">L${q.L}</span><span class="pill">${label}</span>`));
  card.appendChild(el('div','q-text', q.q));
  if(q.code) card.appendChild(el('div',null, pre(q.code)));

  const ans=el('div','ans'); ans.hidden=true;

  if(q.type==='mcq'){
    const box=el('div','choices'); const inputs=[];
    q.choices.forEach((ch,i)=>{
      const lab=el('label','choice');
      lab.innerHTML=`<input type="radio" name="e-${idx}"><span>${esc(ch)}</span>`;
      box.appendChild(lab); inputs.push(lab.querySelector('input'));
    });
    card.appendChild(box);
    ans.appendChild(el('div','why', q.why));
    card.appendChild(ans);
    return { node:card, grade(){
      const sel=inputs.findIndex(x=>x.checked);
      [...box.children].forEach((c,j)=>{
        c.style.cursor='default';
        if(j===q.correct) c.classList.add('right');
        else if(j===sel) c.classList.add('wrong');
      });
      inputs.forEach(x=>x.disabled=true);
      ans.hidden=false;
      return {kind:'auto', correct: sel===q.correct};
    }};
  }

  if(q.type==='out'){
    const row=el('div','btn-row');
    const input=el('input'); input.type='text'; input.placeholder='output…'; input.style.maxWidth='260px';
    row.appendChild(input); card.appendChild(row);
    const verdict=el('div','verdict');
    ans.appendChild(verdict);
    ans.appendChild(el('div',null,`<span class="eyebrow">Answer</span> <code>${esc(q.ans)}</code>`));
    ans.appendChild(el('div','why', q.why));
    card.appendChild(ans);
    return { node:card, grade(){
      const ok=norm(input.value)===norm(q.ans);
      input.disabled=true;
      verdict.textContent= ok?'correct':'not quite';
      verdict.className='verdict '+(ok?'ok':'bad');
      ans.hidden=false;
      return {kind:'auto', correct:ok};
    }};
  }

  // write
  const ta=el('textarea'); ta.placeholder='Write your program here (or on paper)…';
  card.appendChild(ta);
  ans.appendChild(el('div','eyebrow','Model solution'));
  ans.appendChild(el('div',null, pre(q.sol)));
  ans.appendChild(el('div','why', q.why));
  const selfRow=el('div','btn-row');
  selfRow.appendChild(el('span',null,'<span style="font-size:14px;color:var(--ink-2)">Self-mark:</span>'));
  const got=el('button','done-btn','I got it'); got.type='button';
  selfRow.appendChild(got);
  got.addEventListener('click', ()=>{ const on=got.dataset.on==='1'; if(on){delete got.dataset.on;got.textContent='I got it';} else {got.dataset.on='1';got.textContent='got it ✓';} });
  ans.appendChild(selfRow);
  card.appendChild(ans);
  return { node:card, grade(){ ta.disabled=true; ans.hidden=false; return {kind:'write'}; } };
}

}`,
  note:"The NULL check is expected every time — skipping it loses marks even if the rest is perfect. Match fopen with fclose, and loop while fscanf != EOF."},

 {L:12, q:"Read 10 integers into an array, then print their average and how many of them are above that average.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int a[10];
    int i, sum = 0;

    for (i = 0; i < 10; i++) {
        scanf("%i", &a[i]);
        sum += a[i];
    }

    double avg = sum / 10.0;

    int above = 0;
    for (i = 0; i < 10; i++)
        if (a[i] > avg) above++;

    printf("Average: %.2f\\n", avg);
    printf("Above average: %i\\n", above);
    return 0;
}`,
  note:"You need the full array in memory because the second pass compares every element to an average you can only compute after reading them all. Divide by 10.0 to keep the average a double."},

 {L:13, q:"Fill a 3 x 3 matrix with values the user enters, then print the sum of each row on its own line.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int m[3][3];
    int i, j;

    for (i = 0; i < 3; i++)
        for (j = 0; j < 3; j++)
            scanf("%i", &m[i][j]);

    for (i = 0; i < 3; i++) {
        int rowSum = 0;
        for (j = 0; j < 3; j++)
            rowSum += m[i][j];
        printf("Row %i sum: %i\\n", i, rowSum);
    }

    return 0;
}`,
  note:"Reset rowSum to 0 at the top of each outer pass, not once before the loops — otherwise the sums accumulate across rows."}
];

/* Lab-level tasks: multi-concept, with edge cases — pitched at the difficulty of
   the real lab assignments (rounding tricks, digit work, validation loops,
   pattern printing, multi-pass arrays), but written fresh for this site.
   This is the tier the midterm's harder write-code questions tend to live in. */
const WRITE_LAB = [
 {L:5, q:"Read a price in dollars (a double) and a tax rate as a whole-number percent, then print the final price rounded to exactly 2 decimal places WITHOUT using any rounding library function.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    double price;
    int ratePct;

    printf("Price: ");
    scanf("%lf", &price);
    printf("Tax rate (%%): ");
    scanf("%i", &ratePct);

    double total = price * (1.0 + ratePct / 100.0);

    /* manual round to 2 decimals: shift, add 0.5, truncate, shift back */
    int cents = (int)(total * 100 + 0.5);
    double rounded = cents / 100.0;

    printf("Total: %.2f\\n", rounded);
    return 0;
}`,
  note:"The ×100, +0.5, cast-to-int, ÷100 trick is the manual-rounding pattern the labs drill. Note ratePct/100.0 (not /100) so the percentage isn't killed by integer division, and %% to print a literal percent sign."},

 {L:7, q:"Read a positive integer and decide whether it is a palindrome (reads the same forwards and backwards, e.g. 12321). Print YES or NO. Use a while loop; do not convert to text.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n;
    printf("n: ");
    scanf("%i", &n);

    int original = n;
    int reversed = 0;

    while (n > 0) {
        reversed = reversed * 10 + n % 10;
        n = n / 10;
    }

    if (reversed == original) printf("YES\\n");
    else                      printf("NO\\n");

    return 0;
}`,
  note:"Save the original before the loop destroys n. reversed = reversed*10 + lastDigit builds the number backwards; compare it to the saved copy. This reverse-a-number pattern is a lab staple."},

 {L:6, q:"Read a size n (1–20) and print a hollow square of '*': the border is stars and the inside is spaces. A 4x4 looks like four rows where the first and last are all stars and the middle rows are a star, spaces, a star.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n, i, j;
    printf("n: ");
    scanf("%i", &n);

    for (i = 0; i < n; i++) {
        for (j = 0; j < n; j++) {
            if (i == 0 || i == n - 1 || j == 0 || j == n - 1)
                printf("*");
            else
                printf(" ");
        }
        printf("\\n");
    }

    return 0;
}`,
  note:"The whole trick is the border test: first/last row (i==0 or i==n-1) OR first/last column (j==0 or j==n-1). Everything else is a space. Nested-loop pattern printing like this is exactly the lab-3 style."},

 {L:9, q:"Read an integer n (n >= 2) and print every prime number from 2 up to and including n, separated by spaces.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n, k, d;
    printf("n: ");
    scanf("%i", &n);

    for (k = 2; k <= n; k++) {
        int isPrime = 1;
        for (d = 2; d < k; d++) {
            if (k % d == 0) {
                isPrime = 0;
                break;
            }
        }
        if (isPrime) printf("%i ", k);
    }
    printf("\\n");

    return 0;
}`,
  note:"A flag (isPrime) plus an inner divisor loop is the primality pattern. break as soon as a divisor is found. This is Lab-4's technique without the digit-sum wrapper."},

 {L:8, q:"Write a menu program: repeatedly show options 1) square a number 2) cube a number 3) quit. Read the choice, act on it, and keep looping until the user picks 3. Reject any choice that isn't 1, 2 or 3.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int choice, x;

    do {
        printf("1) square  2) cube  3) quit\\n");
        printf("Choice: ");
        scanf("%i", &choice);

        if (choice == 1) {
            printf("Number: ");
            scanf("%i", &x);
            printf("%i\\n", x * x);
        } else if (choice == 2) {
            printf("Number: ");
            scanf("%i", &x);
            printf("%i\\n", x * x * x);
        } else if (choice != 3) {
            printf("Invalid choice\\n");
        }
    } while (choice != 3);

    printf("Bye\\n");
    return 0;
}`,
  note:"do-while is right because the menu must show at least once. The loop condition (choice != 3) is the quit test; the else-if chain handles each option and rejects anything else. Menu loops like this are classic lab material."},

 {L:12, q:"Read n (1–100), then read n integers into an array. Print the maximum value and how many times that maximum appears.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int n, i;
    int a[100];

    printf("How many: ");
    scanf("%i", &n);
    for (i = 0; i < n; i++)
        scanf("%i", &a[i]);

    int max = a[0];
    for (i = 1; i < n; i++)
        if (a[i] > max) max = a[i];

    int count = 0;
    for (i = 0; i < n; i++)
        if (a[i] == max) count++;

    printf("Max %i appears %i time(s)\\n", max, count);
    return 0;
}`,
  note:"Two passes over the array: one to find the max, a second to count it — you can't count while still searching, because the max isn't known until the first pass finishes. Seed max from a[0], not 0."},

 {L:13, q:"Read a 3x3 matrix of integers, print it as a grid, then print whether it is symmetric — that is, a[i][j] equals a[j][i] for every pair.",
  sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    int m[3][3];
    int i, j;

    for (i = 0; i < 3; i++)
        for (j = 0; j < 3; j++)
            scanf("%i", &m[i][j]);

    for (i = 0; i < 3; i++) {
        for (j = 0; j < 3; j++)
            printf("%4i", m[i][j]);
        printf("\\n");
    }

    int symmetric = 1;
    for (i = 0; i < 3; i++)
        for (j = 0; j < 3; j++)
            if (m[i][j] != m[j][i]) symmetric = 0;

    if (symmetric) printf("Symmetric\\n");
    else           printf("Not symmetric\\n");

    return 0;
}`,
  note:"Comparing m[i][j] with m[j][i] across all pairs is the symmetry check — a flag that only ever flips to 0. Fill, print, then test: three separate loop nests, each doing one job."}
];

let writeFilter = 'all';
function writeItems(){
  const real  = LESSONS.flatMap(L => (L.ex||[]).map(e => ({L:L.n, q:e.q, sol:e.sol, note:e.note, src:'course'})));
  const extra = WRITE_EXTRA.map(e => ({L:e.L, q:e.q, sol:e.sol, note:e.note, src:'extra'}));
  const lab   = WRITE_LAB.map(e => ({L:e.L, q:e.q, sol:e.sol, note:e.note, src:'lab'}));
  return real.concat(extra, lab).sort((a,b)=> a.L - b.L);
}
function renderWrite(){
  const s = document.getElementById('v-write');
  s.innerHTML = '';
  const items = writeItems();
  const wrap = el('div','col stack');
  const nReal = items.filter(i=>i.src==='course').length;
  const nLab  = items.filter(i=>i.src==='lab').length;
  wrap.appendChild(el('div', null,
    `<div class="eyebrow">Write code · ${items.length} tasks</div>
     <h1 style="font-size:clamp(24px,5.5vw,30px);margin:6px 0 4px">Write it by hand, then check</h1>
     <p class="lede">The exam is handwritten, so the only practice that counts is drafting whole programs on paper. ${nReal} are the real course exercises, ${nLab} are <b>lab-level</b> tasks pitched where the harder exam questions live, and the rest are lighter drills. Try each before you reveal the answer.</p>`));

  const lessonsWith = [...new Set(items.map(i=>i.L))].sort((a,b)=>a-b);
  const chips = el('div','chips');
  const mkChip = (val,label) => {
    const c = el('button','chip',label); c.type='button';
    c.setAttribute('aria-pressed', writeFilter===val ? 'true':'false');
    c.addEventListener('click', ()=>{ writeFilter=val; renderWrite(); });
    return c;
  };
  chips.appendChild(mkChip('all','All'));
  chips.appendChild(mkChip('lab','Lab level'));
  chips.appendChild(mkChip('course','Course exercises'));
  chips.appendChild(mkChip('extra','Extra drills'));
  lessonsWith.forEach(n => chips.appendChild(mkChip(n,'L'+n)));
  wrap.appendChild(chips);

  const done = store.get('csci151.write', {});
  const list = el('div','stack');
  const shown = items.filter(i =>
    writeFilter==='all' ? true :
    writeFilter==='course' ? i.src==='course' :
    writeFilter==='extra' ? i.src==='extra' :
    writeFilter==='lab' ? i.src==='lab' :
    i.L===writeFilter);

  shown.forEach(item => {
    const key = 'L'+item.L+'|'+item.q.slice(0,40);
    const card = el('div','q');
    const tag = item.src==='course' ? '<span class="pill">Course exercise</span>'
              : item.src==='lab' ? '<span class="pill lab">Lab level</span>'
              : '<span class="pill">Extra drill</span>';
    card.appendChild(el('div','q-top', `<span class="pill acc">L${item.L}</span>${tag}<span class="pill">Write code</span>`));
    card.appendChild(el('div','q-text', `<b>${item.q}</b>`));

    const ta = el('textarea'); ta.placeholder = 'Write your program here (or on paper)…';
    card.appendChild(ta);

    const sol = el('div','ans'); sol.hidden = true;
    sol.appendChild(el('div','eyebrow','Model solution'));
    sol.appendChild(el('div', null, pre(item.sol)));
    if(item.note) sol.appendChild(el('div','why', item.note));

    const row = el('div','btn-row');
    const btn = el('button','act ghost','Show solution'); btn.type='button';
    btn.addEventListener('click', ()=>{ sol.hidden=!sol.hidden; btn.textContent = sol.hidden?'Show solution':'Hide solution'; });
    const doneBtn = el('button','done-btn', done[key]?'done ✓':'mark done'); doneBtn.type='button';
    if(done[key]) doneBtn.dataset.on='1';
    doneBtn.addEventListener('click', ()=>{
      const map = store.get('csci151.write', {});
      map[key] = !map[key];
      store.set('csci151.write', map);
      if(map[key]){ doneBtn.dataset.on='1'; doneBtn.textContent='done ✓'; }
      else { delete doneBtn.dataset.on; doneBtn.textContent='mark done'; }
    });
    row.appendChild(btn); row.appendChild(doneBtn);
    card.appendChild(row);
    card.appendChild(sol);
    list.appendChild(card);
  });
  wrap.appendChild(list);
  s.appendChild(wrap);
}
