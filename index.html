<title>Midterm One Drill</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root{
    --paper:#f7f5fc; --surface:#ffffff; --sunk:#f0ecf9;
    --ink:#1a1626; --ink-2:#55506a; --ink-3:#8b86a0;
    --rule:#eae5f5; --rule-2:#d8d0ec;
    --accent:#7c3aed; --accent-2:#a855f7; --accent-soft:#f1e9fe;
    --ok:#2b7a51; --ok-soft:#e6f1ea;
    --bad:#c23b2c; --bad-soft:#f9e8e5;
    --code-bg:#f4f0fb;
    --shadow:0 1px 2px rgba(37,20,66,.04),0 4px 16px rgba(37,20,66,.05);
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#120f1a; --surface:#1a1626; --sunk:#221c33;
      --ink:#ece8f6; --ink-2:#b2aac6; --ink-3:#847c9c;
      --rule:#2b2440; --rule-2:#423a5c;
      --accent:#b99bff; --accent-2:#c9b0ff; --accent-soft:#261d3f;
      --ok:#6ec294; --ok-soft:#16281f;
      --bad:#ea8877; --bad-soft:#2b1a17;
      --code-bg:#201a30;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#120f1a; --surface:#1a1626; --sunk:#221c33;
    --ink:#ece8f6; --ink-2:#b2aac6; --ink-3:#847c9c;
    --rule:#2b2440; --rule-2:#423a5c;
    --accent:#b99bff; --accent-2:#c9b0ff; --accent-soft:#261d3f;
    --ok:#6ec294; --ok-soft:#16281f;
    --bad:#ea8877; --bad-soft:#2b1a17;
    --code-bg:#201a30;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--mono);font-weight:600;line-height:1.22;letter-spacing:-.01em;text-wrap:balance;margin:0}
  h1{letter-spacing:-.02em}
  p{margin:0}
  a{color:var(--accent)}
  code,pre,kbd{font-family:var(--mono)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---- top bar ---- */
  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
  .bar-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  .brand span{color:var(--accent)}
  .tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;background:none;border:0;color:var(--ink-2);padding:6px 10px;border-radius:5px;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--ink);background:var(--sunk)}
  .tab[aria-selected="true"]{background:var(--accent);color:var(--surface)}

  /* ---- layout ---- */
  .wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:28px 72px}
  .col{max-width:70ch}
  .stack{display:flex;flex-direction:column;gap:18px}
  .stack-lg{display:flex;flex-direction:column;gap:34px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .lede{color:var(--ink-2);font-size:17px;line-height:1.55}
  hr{border:0;border-top:1px solid var(--rule);margin:0}

  /* ---- exam clock ---- */
  .clock{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-left:3px solid var(--accent);padding:2px 0 2px 14px}
  .clock b{font-family:var(--mono);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;color:var(--accent);letter-spacing:-.01em}
  .clock small{color:var(--ink-2);font-size:14px}

  /* ---- hero countdown ---- */
  .hero{background:linear-gradient(140deg,#6d28d9 0%,#7c3aed 46%,#a855f7 100%);color:#fff;border-radius:18px;padding:26px 26px 24px;box-shadow:0 16px 40px -14px rgba(124,58,237,.6);position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.10)}
  .hero::before{content:"";position:absolute;right:24px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
  .hero>*{position:relative;z-index:1}
  .hlabel{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.82}
  .hbig{font-family:var(--mono);font-size:clamp(34px,8.5vw,52px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;margin-top:10px}
  .hsub{font-size:13.5px;opacity:.92;margin-top:10px;line-height:1.5}
  .tile{transition:transform .14s ease,box-shadow .14s ease}
  .tile:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(37,20,66,.05),0 10px 26px rgba(37,20,66,.09)}
  .reflink{display:block;text-decoration:none;color:#fff;background:linear-gradient(135deg,#6d28d9,#a855f7);border-radius:14px;padding:16px 18px;box-shadow:0 10px 26px -10px rgba(124,58,237,.55);transition:transform .14s ease}
  .reflink:hover{transform:translateY(-2px)}

  /* ---- generic pieces ---- */
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .tile{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:15px 17px;box-shadow:var(--shadow)}
  .tile h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .tile p{font-size:14px;color:var(--ink-2)}
  .k{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600}

  pre{background:var(--code-bg);border:1px solid var(--rule);border-radius:7px;padding:12px 14px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0}
  pre b{font-weight:600;color:var(--accent)}
  p code,li code{background:var(--code-bg);border-radius:4px;padding:1px 5px;font-size:.88em}
  ul,ol{margin:0;padding-left:20px}
  li{margin:5px 0}
  li::marker{color:var(--ink-3)}

  .trap{border-left:3px solid var(--bad);background:var(--bad-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:14.5px}
  .trap b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;color:var(--bad);margin-bottom:2px}

  /* ---- lesson list ---- */
  .lesson{border-top:1px solid var(--rule);padding-top:16px}
  .lesson-head{display:flex;gap:12px;align-items:flex-start;cursor:pointer;user-select:none}
  .num{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:4px;min-width:26px;font-variant-numeric:tabular-nums}
  .lesson h3{font-size:16px;flex:1}
  .lesson-sub{font-size:14px;color:var(--ink-2);margin-top:2px}
  .chev{color:var(--ink-3);font-family:var(--mono);font-size:12px;padding-top:4px}
  .lesson-body{padding:16px 0 4px 38px;display:flex;flex-direction:column;gap:16px}
  @media(max-width:520px){.lesson-body{padding-left:0}}

  .done-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;border:1px solid var(--rule-2);background:none;color:var(--ink-3);border-radius:20px;padding:3px 10px;cursor:pointer}
  .done-btn[data-on="1"]{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}

  /* ---- questions ---- */
  .q{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:17px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow)}
  .q-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--rule-2);border-radius:20px;padding:2px 8px}
  .pill.acc{color:var(--accent);border-color:transparent;background:var(--accent-soft)}
  .pill.lab{color:var(--surface);border-color:transparent;background:var(--accent)}
  .q-text{font-size:15px}
  .choices{display:flex;flex-direction:column;gap:6px}
  .choice{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;padding:8px 11px;border:1px solid var(--rule);border-radius:7px;cursor:pointer;transition:border-color .12s,background .12s}
  .choice:hover{border-color:var(--accent);background:var(--accent-soft)}
  .choice input{margin-top:5px;accent-color:var(--accent)}
  .choice.right{border-color:var(--ok);background:var(--ok-soft)}
  .choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
  input[type=text]{font-family:var(--mono);font-size:14px;width:100%;padding:8px 10px;border:1px solid var(--rule-2);border-radius:6px;background:var(--sunk);color:var(--ink)}
  textarea{font-family:var(--mono);font-size:13.5px;width:100%;min-height:120px;padding:10px;border:1px solid var(--rule-2);border-radius:6px;background:var(--sunk);color:var(--ink);resize:vertical}
  .ans{border-top:1px dashed var(--rule-2);padding-top:11px;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
  .ans .why{color:var(--ink-2)}
  .verdict{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}

  button.act{font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;background:var(--accent);color:var(--surface);border:0;border-radius:6px;padding:8px 15px;cursor:pointer;align-self:flex-start}
  button.act:hover{filter:brightness(1.08)}
  button.ghost{background:none;color:var(--accent);border:1px solid var(--rule-2)}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:12px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink-2);border-radius:20px;padding:4px 11px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

  /* ---- exam runner ---- */
  .examtop{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:10;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:11px 15px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .timer{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .timer.low{color:var(--bad)}
  .bar-track{flex:1;min-width:110px;height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
  .bar-fill{height:100%;background:var(--accent);width:0}
  table{border-collapse:collapse;font-size:14px;width:100%}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule)}
  th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  td code{font-size:13px}
  .scroller{overflow-x:auto}
</style>

<script>
/* ============================ COURSE DATA ============================
   Lesson gists, key points and EXERCISES are taken from the CSCI 151
   lesson pages (sst-csci.com). Solutions, traps, trace questions and
   mock exams are written for this study site.
   ==================================================================== */

const LESSONS = [
{n:1, mod:"Module 1", title:"How Do Programs Work?", gist:"Hardware vs software, what a CPU actually does, and the ladder from machine code to C.",
 points:[
  "<b>Hardware</b> is anything physical you can touch. <b>Software</b> is the programs. A DVD is hardware; what's on it is software.",
  "<b>Main memory</b> holds the running program and its short-term data. <b>Secondary storage</b> (disk, SSD) holds what isn't needed right now. Browsing folders = looking at secondary storage.",
  "CPU parts: <b>Control Unit</b> (coordinates), <b>ALU</b> (integer arithmetic + logic), <b>FPU</b> (floating-point math), <b>Registers</b> (super short-term memory), <b>Program Counter</b> (address the next instruction comes from).",
  "A <b>bit</b> = binary digit, 0 or 1. Implemented historically by mechanical switches, vacuum tubes, transistors, and today integrated circuits.",
  "<b>Machine language</b> = raw binary the CPU runs. <b>Assembly</b> = English-like abbreviations for those instructions (<code>add r1, r2, r3</code>). Both are <b>low-level</b> and <b>not portable</b> — tied to one CPU.",
  "An <b>assembler</b> turns assembly into machine code. A <b>compiler</b> turns a high-level language into lower-level code.",
  "<b>Portable</b> = the program runs on a variety of different computers. High-level languages are generally portable because several compilers target different CPU families.",
  "C: evolved by <b>Dennis Ritchie</b> at AT&amp;T Bell Labs in the early 1970s from BCPL and B, for the PDP-11; used to write Unix. Standards: 1978 first spec, <b>C89</b> (ANSI C), C90 (ISO), <b>C99</b>, <b>C11</b>.",
  "<b>Backwards compatibility</b> = a program written in an older version still works in newer versions. C is mostly, but not completely, backwards compatible.",
  "C's drawbacks: manual memory management (biggest source of bugs), manual error handling, no bounds checking (security issues), no encapsulation / information hiding."
 ],
 traps:[
  {t:"Assembler vs compiler", b:"Both translate, but an <b>assembler</b> goes assembly → machine code (one-to-one-ish), a <b>compiler</b> goes high-level → low-level (one line becomes many instructions). Exam loves this pair."},
  {t:"Portability direction", b:"High-level = portable. Machine and assembly = NOT portable. Don't flip it."},
  {t:"Why assembly still exists", b:"Two reasons only: hand-optimising for a specific CPU, and low-level systems work (drivers, peripherals)."}
 ],
 quiz:[
  {q:"How are main memory and secondary storage different?", a:"Main memory holds the currently running program and its working data; it's fast and directly used by the CPU. Secondary storage (hard disk, SSD) holds data not needed at this moment; the CPU fetches things from it into main memory when the running program needs them. Main memory is volatile working space, secondary storage is the persistent file system you browse."},
  {q:"What is the difference between a compiler and an assembler? How are they similar?", a:"Both are programs that translate source code into a lower-level form. An assembler translates assembly language into binary machine language — essentially a symbolic renaming of machine instructions. A compiler translates a high-level language (like C) into low-level code; one high-level statement can expand into many machine instructions, and the compiler must handle abstractions the CPU has no concept of."},
  {q:"Name three high-level languages not mentioned in the lesson.", a:"Examples: Rust, Go, JavaScript, Kotlin, Swift, Ruby, Haskell, MATLAB, R, Pascal."},
  {q:"Why write in a machine-independent language? When is machine-dependent better?", a:"Machine-independent (portable) code runs on many CPU families without rewriting, and is far easier to write and maintain for large programs. Machine-dependent code is better when you need maximum performance on one specific chip, or when you must touch hardware directly — device drivers, peripherals, microcontroller bootstrapping."},
  {q:"Why do we want backwards compatibility in a language?", a:"So existing programs, libraries and accumulated code keep working when the language is updated. Without it, every new standard would force expensive rewrites and people would simply refuse to upgrade."}
 ], ex:[]},

{n:2, mod:"Module 1", title:"Intro to Eclipse CDT", gist:"The three stages of getting a program to run, and what an IDE does for you.",
 points:[
  "The three stages of program creation and execution: <b>1. Write</b> the program, <b>2. Build</b> (compile <i>and link</i>), <b>3. Run</b> it.",
  "The build stage includes compiling, but also combines multiple program files and libraries into a single executable machine-language program — that's the <b>linking</b> step.",
  "An <b>IDE</b> (Integrated Development Environment) puts editing, compiling, running and debugging in one windowed application. This course uses <b>Eclipse CDT</b> with the <b>MinGW</b> compiler tools.",
  "<b>Debug</b> vs <b>Release</b> build settings control what internal information is included in the runnable program (debug keeps symbols for stepping through code; release is stripped and optimised).",
  "<b>Comments</b> don't affect what the program does — they exist for the humans reading the code, including future you."
 ],
 traps:[
  {t:"Build is not just compile", b:"If a question asks for the stages, \"compile\" alone is incomplete — building is compile <b>and link</b>."}
 ], quiz:[],
 ex:[
  {q:"For a box with dimensions l, w, h (assign any values you want), compute and output the volume and surface area.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    double l = 3.0, w = 4.0, h = 5.0;

    double volume = l * w * h;
    double surface = 2 * (l*w + l*h + w*h);

    printf("Volume:       %.2f\\n", volume);
    printf("Surface area: %.2f\\n", surface);

    return 0;
}`}
 ]},

{n:3, mod:"Module 1", title:"Programs and Variables", gist:"Syntax and the three error types, readable code, the five-step problem-solving process, and variables.",
 points:[
  "<b>Syntax</b> = the rules for properly forming statements in a language, just like grammar rules for forming English sentences.",
  "<b>Syntax error</b>: the code breaks the language rules — the compiler catches it and refuses to build. e.g. a missing semicolon.",
  "<b>Runtime error</b>: the program compiles and starts, then crashes or fails while running. e.g. dividing by zero.",
  "<b>Logical error</b>: it compiles, it runs, it finishes — and the answer is simply wrong. The compiler cannot help you here. These are the dangerous ones.",
  "Five-step program development (waterfall + Polya): <b>1</b> understand / analyse the problem, <b>2</b> design a solution, <b>3</b> implement it in code, <b>4</b> test and debug, <b>5</b> maintain / review.",
  "A <b>variable</b> is a named box in memory holding a value of a declared type. Declare it, then assign to it: <code>int count; count = 5;</code> or together, <code>int count = 5;</code>.",
  "Naming: use meaningful names, start with a letter or underscore, no spaces, C is <b>case-sensitive</b>, and you cannot use keywords (<code>int</code>, <code>for</code>, <code>return</code>...)."
 ],
 traps:[
  {t:"Case sensitivity", b:"<code>sum</code>, <code>Sum</code> and <code>SUM</code> are three <i>different</i> variables. Legal, but a guaranteed logical error waiting to happen — and a favourite exam question."},
  {t:"Runtime vs logical", b:"Runtime error = the program breaks. Logical error = the program works fine and lies to you. If the question says \"produces the wrong answer but runs\", it's logical."},
  {t:"Declaring twice", b:"<code>int x = 5; int x = 7;</code> in the same scope is a syntax error, not an overwrite."}
 ],
 quiz:[
  {q:"Give examples of syntax errors in English sentences.", a:"\"Dog the ran fast\" (word order), \"He go to school yesterday\" (verb agreement/tense), \"I has three book\" (agreement and plural), a sentence with no verb at all. Each breaks a structural rule while the intended meaning may still be guessable — exactly like a missing semicolon in C."},
  {q:"What is the main difference between a runtime error and a logical error?", a:"A runtime error stops or crashes the program while it is executing — the program cannot finish. A logical error lets the program run to completion perfectly normally, but the result it produces is incorrect. The compiler catches neither, but a runtime error announces itself; a logical error stays silent, which makes it more dangerous."},
  {q:"Why is each of the five problem-solving steps important? What if we skipped the first or second?", a:"Skipping step 1 (understanding the problem) means you may build a correct solution to the wrong problem — all later work is wasted. Skipping step 2 (design) means you code without a plan, producing tangled code that is hard to test, debug or extend, and you often discover halfway through that the structure can't support what's needed. Each step catches a class of mistake far more cheaply than the step after it."},
  {q:"Why is declaring sum, SUM and Sum a bad idea even though it is legal?", a:"C is case-sensitive so the compiler happily treats them as three separate variables, but a human reader cannot reliably tell them apart. Mistyping one for another produces a silent logical error that compiles and runs. Names should differ in meaning, not just in capitalisation."}
 ],
 ex:[
  {q:"Measurement conversion. Store a length in metres as a double, convert it to centimetres, myriametres, inches, miles and furlongs, and print all values with suitable messages.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    double metres = 1609.344;

    double cm         = metres * 100.0;
    double myriametre = metres / 10000.0;   /* 1 myriametre = 10 000 m */
    double inches     = metres / 0.0254;
    double miles      = metres / 1609.344;
    double furlongs   = metres / 201.168;   /* 1 furlong = 1/8 mile */

    printf("Length:      %.4f m\\n", metres);
    printf("Centimetres: %.4f cm\\n", cm);
    printf("Myriametres: %.6f\\n", myriametre);
    printf("Inches:      %.4f in\\n", inches);
    printf("Miles:       %.6f mi\\n", miles);
    printf("Furlongs:    %.6f fur\\n", furlongs);

    return 0;
}`,
   note:"Every conversion factor is a <code>double</code> literal with a decimal point. Writing <code>metres / 10000</code> is fine here because <code>metres</code> is a double, but get into the habit of <code>10000.0</code> — the moment both sides are ints you get truncation."},
  {q:"Cone properties. Store height and radius of a cone as doubles. Compute the surface area, the area of the circular base, and the volume. Use sqrt(x) from math.h. Output everything.",
   sol:`#include <stdio.h>
#include <math.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    double PI = 3.14159265358979;
    double h = 10.0;
    double r = 3.0;

    double slant   = sqrt(r*r + h*h);        /* slant height */
    double base    = PI * r * r;
    double lateral = PI * r * slant;
    double surface = base + lateral;
    double volume  = base * h / 3.0;

    printf("Radius:        %.4f\\n", r);
    printf("Height:        %.4f\\n", h);
    printf("Slant height:  %.4f\\n", slant);
    printf("Base area:     %.4f\\n", base);
    printf("Surface area:  %.4f\\n", surface);
    printf("Volume:        %.4f\\n", volume);

    return 0;
}`,
   note:"Total surface = base + lateral, and lateral needs the slant height sqrt(r²+h²) — not h. Volume is (1/3)·base·h; write <code>/ 3.0</code>, never <code>/ 3</code> if any int is involved."},
  {q:"Grade calculator. Declare variables holding all your grade information, use the syllabus assessment percentages, and compute and display your final course percentage as a floating-point number.",
   sol:`#include <stdio.h>

int main(void) {
    setvbuf(stdout, NULL, _IONBF, 0);

    /* raw scores, as percentages */
    double labs      = 88.0;
    double midterm1  = 74.0;
    double midterm2  = 80.0;
    double finalExam = 69.0;

    /* weights, from the syllabus - substitute your real ones */
    double wLabs = 0.30, wMid1 = 0.15, wMid2 = 0.15, wFinal = 0.40;

    double total = labs*wLabs + midterm1*wMid1
                 + midterm2*wMid2 + finalExam*wFinal;

    printf("Labs      %.1f  (weight %.0f%%)\\n", labs,      wLabs*100);
    printf("Midterm 1 %.1f  (weight %.0f%%)\\n", midterm1,  wMid1*100);
    printf("Midterm 2 %.1f  (weight %.0f%%)\\n", midterm2,  wMid2*100);
    printf("Final     %.1f  (weight %.0f%%)\\n", finalExam, wFinal*100);
    printf("----------------------------\\n");
    printf("Course percentage: %.2f%%\\n", total);

    return 0;
}`,
   note:"To print a literal percent sign with printf you write <code>%%</code>. A single <code>%</code> makes printf hunt for a format specifier and read garbage."}
 ]},

{n:4, mod:"Module 1", title:"Basic Types and I/O", gist:"The five basic types, printf/scanf format characters, escape characters, ASCII.",
 points:[
  "<b>int</b> — integers, no decimal places. <b>float</b> — floating-point. <b>double</b> — same as float but roughly twice the precision. <b>char</b> — a single character. <b>_Bool</b> — 0 or 1 (added in C99).",
  "<b>printf</b> integers: <code>%i</code> or <code>%d</code> decimal, <code>%o</code> octal (e.g. 023), <code>%x</code> hex (e.g. 0xA2F).",
  "<b>scanf</b> integers: just use <code>%i</code> for all three representations — a leading <code>0</code> tells scanf it's octal, a leading <code>0x</code> tells it hex.",
  "<b>printf</b> floats: <code>%f</code> plain, <code>%e</code> scientific, <code>%g</code> whatever looks best.",
  "<b>scanf</b> floats: <code>%f</code> for a <b>float</b>, <code>%lf</code> (\"long float\") for a <b>double</b>. This asymmetry is the single most-tested detail in the lesson.",
  "<b>char</b>: <code>%c</code> for both printf and scanf. Chars are stored internally as ints, using their <b>ASCII</b> values.",
  "<b>_Bool</b>: assigning any nonzero number stores <b>1</b>. Print it with <code>%i</code> — there is no specifier that prints \"true\"/\"false\".",
  "Always put an <b>&amp;</b> before the variable in scanf when reading any basic type.",
  "Put <code>setvbuf(stdout, NULL, _IONBF, 0);</code> at the start of main so Eclipse synchronises input and output the way you expect."
 ],
 traps:[
  {t:"%f vs %lf in scanf", b:"<code>scanf(\"%f\", &amp;myDouble)</code> silently corrupts the value. A double needs <code>%lf</code> on <i>input</i>. On output, printf takes <code>%f</code> for both — because floats are promoted to double when passed."},
  {t:"Missing the ampersand", b:"<code>scanf(\"%i\", n)</code> instead of <code>&amp;n</code> compiles but crashes or writes to a random address. scanf needs the <i>address</i> of the box, not its contents."},
  {t:"Escape characters", b:"<code>\\n</code> newline, <code>\\t</code> tab, <code>\\\\</code> backslash, <code>\\'</code> single quote, <code>\\\"</code> double quote, <code>\\0</code> null. To print one backslash you type two."},
  {t:"_Bool stores 1, not the value", b:"<code>_Bool b = 42;</code> then <code>printf(\"%i\", b)</code> prints <b>1</b>, not 42."}
 ],
